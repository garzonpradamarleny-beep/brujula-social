CÓMO DEBE SER (sigue todo)
1. Contexto: una situación de 180 a 320 palabras en 3 o 4 párrafos, realista y situada en Colombia (o en otro país si el tema lo pide), con al menos tres actores (personas, grupos o instituciones) que tienen posturas o intereses distintos. Incluye datos concretos: cifras, lugares genéricos ("un municipio del Cauca"), plazos. Si sirve a la tarea, incluye una cita textual de un actor ficticio o una tabla pequeña.
2. Enunciado: debe exigir inferir, comparar perspectivas, evaluar argumentos o prever efectos a partir del contexto. No debe poder responderse copiando una frase del texto ni solo de memoria (en tareas de Constitución, el estudiante aplica un principio constitucional al caso).
3. Opciones: cuatro, de longitud y estilo parecidos, todas plausibles para quien lee rápido, y una sola correcta sin discusión. Construye los distractores con errores típicos: una afirmación verdadera que no responde lo preguntado; una generalización absoluta ("siempre", "solo", "todos"); atribuir una postura al actor equivocado; invertir causa y efecto o confundir medio con fin; un dato que el texto no menciona.

${s.recent.length?`- No repitas estos temas recientes: ${s.recent.join("; ")}.`:""}

{"tema":"título corto","contexto":["párrafo 1","párrafo 2","párrafo 3"],"cita":null,"tabla":null,"enunciado":"...","opciones":["...","...","...","..."],"correcta":0,"porque":"por qué la correcta es la correcta (máximo 60 palabras)","descartes":["por qué la opción 1 es incorrecta, o \\"\\" si es la correcta","...","...","..."]}

 for(let k=0;k<n;k++){const i=document.createElement("i"),ang=Math.random()*Math.PI*2,d=reach*(.45+Math.random()*.55);i.className=kind||(k%4===0?"spark":k%3===0?"gold":"");
  i.style.cssText=`--tx:${Math.cos(ang)*d}px;--ty:${Math.sin(ang)*d-30}px;--tr:${Math.random()*360-180}deg;--t:${.9+Math.random()*.7}s`;b.appendChild(i)}
 document.body.appendChild(b);setTimeout(()=>b.remove(),1900)}
function feathers(){land();if(calm())return;const a=document.getElementById("howl");if(!a)return;
 const r=a.getBoundingClientRect();burstAt(r.left+r.width/2,r.top+r.height/2,14,130)}

/* ---------- Búho ayudante ---------- */
const H=document.getElementById("helper");let hbT=null,flying=false,tipN=0;
H.innerHTML=`<div id="hbub" class="h-bubble" role="status" hidden><p></p></div><section id="hpanel" class="h-panel" role="dialog" aria-labelledby="hp-title" hidden></section><button id="howl" class="h-owl moon" aria-label="Búho ayudante: toca para un consejo">${OWL(false,true)}</button>`;
const TIPS=["La escala depende de dónde ocurre el problema, no de dónde se publicó la noticia.",
 "Una dimensión es <b>política</b> cuando hay derechos, leyes, Estado o poder en juego.",
 "Un actor es cualquier persona, grupo o institución con interés en el problema.",
 "En el ICFES, desconfía de las opciones con palabras absolutas como «solo», «siempre» o «nunca».",
 "Si dudas entre dos opciones, vuelve a la fuente: la respuesta correcta se apoya en lo que dice el texto.",
 "Pensamiento sistémico es ver cómo se cruzan varias dimensiones en un mismo problema."];
function land(){const h=document.getElementById("howl");if(!h)return;h.classList.remove("land");void h.offsetWidth;h.classList.add("land")}
function helperSay(t,mood="",ms=6500){if(H.hidden)return;const hb=document.getElementById("hbub");
 hb.className="h-bubble"+(mood?" "+mood:"");hb.querySelector("p").innerHTML=t;hb.hidden=false;void hb.offsetWidth;hb.classList.add("pop");
 H.dataset.mood=mood==="no"?"worried":"talk";clearTimeout(hbT);hbT=setTimeout(()=>{hb.hidden=true;H.dataset.mood=""},ms)}
function hideBubble(){clearTimeout(hbT);document.getElementById("hbub").hidden=true;H.dataset.mood=""}
function greet(){const first=esc((S.name||"").split(" ")[0]);
 if(S.st==="reg")helperSay("¡Hola! Soy tu búho guía. Escribe tu nombre y elige tu curso para empezar. Si me tocas, te doy un consejo.");
 else if(S.st==="mode")helperSay(`${first}, elige cómo practicar. En la <b>práctica ilimitada</b> puedes hacer todas las preguntas que quieras y ver tu puntaje cuando quieras.`);
 else if(S.st==="free"&&S.fq&&S.fpa==null)helperSay(S.fq.n===1&&S.fq.origen==="banco"&&AI?"Esta primera pregunta es del banco; mientras la respondes, ya estoy escribiendo una nueva para ti con IA.":S.fq.n===1?"Lee <b>toda</b> la situación antes de mirar las opciones. En el ICFES la respuesta siempre se apoya en el texto.":`Pregunta ${S.fq.n}. <b>Consejo:</b> ${TIPS[tipN++%TIPS.length]}`);
 else if(S.st==="score"){const s=freeStats();if(s.n)helperSay(`Vas en <b>${s.lname}</b> con ${s.est} puntos estimados. ${s.level>=3?"¡Muy bien!":"¡Sigue practicando, cada pregunta suma!"}`,s.level>=3?"ok":"")}
 else if(S.st==="intro")helperSay(`Hola, ${first}. Lee esta guía con calma: la vas a usar en los seis casos.`);
 else if(S.st==="play"&&S.ph===0)helperSay(`Caso ${S.i+1} de ${T.length}: <b>${T[S.i].t}</b>. Lee la fuente y luego ubica la escala, las dimensiones y los actores.`);
 else if(S.st==="end"){const p=S.pts/(T.length*5);helperSay(p>=.8?`¡Lo lograste, ${first}! Eres un gran lector de lo social.`:p>=.5?`Buen trabajo, ${first}. Con un poco de práctica llegas lejos.`:`Ánimo, ${first}. Cada caso te enseña algo nuevo.`,p>=.5?"ok":"")}}
/* Vuelo del búho desde la portada hasta la esquina */
function flyToCorner(){if(S.st!=="splash"||flying)return;clearTimeout(splashTimer);
 const src=document.querySelector(".splash .scene .owl"),r0=src&&src.getBoundingClientRect();
 flying=!!r0&&!calm();S.st="reg";render();
 const h=document.getElementById("howl");
 if(!flying)return;
 h.classList.add("ghost");const r1=h.querySelector(".owl").getBoundingClientRect(),k=r1.width/r0.width;
 const c=document.createElement("div");c.className="flyer";c.style.width=r0.width+"px";c.innerHTML=OWL(false,true);c.firstElementChild.classList.add("flying");document.body.appendChild(c);
 const mx=r0.left*.45+r1.left*.55-30,my=Math.max(8,Math.min(r0.top,r1.top)-60);
 const anim=c.animate([
  {transform:`translate(${r0.left}px,${r0.top}px) scale(1)`},
  {transform:`translate(${r0.left}px,${r0.top-40}px) scale(1.06) rotate(-4deg)`,offset:.16},
  {transform:`translate(${mx}px,${my}px) scale(${(1+k)/2}) rotate(-16deg)`,offset:.52},
  {transform:`translate(${r1.left}px,${r1.top}px) scale(${k}) rotate(0deg)`}],
  {duration:1500,easing:"cubic-bezier(.45,.05,.25,1)",fill:"forwards"});
 const iv=setInterval(()=>{const b=c.getBoundingClientRect();burstAt(b.left+b.width/2,b.top+b.height*.6,2,36)},120);
 anim.onfinish=()=>{clearInterval(iv);c.remove();h.classList.remove("ghost");flying=false;land();
  const b=h.getBoundingClientRect();burstAt(b.left+b.width/2,b.top+b.height/2,10,70);setTimeout(greet,250)}}
/* ---------- Panel del búho: explicaciones, pistas con IA y chat ---------- */
const P=document.getElementById("hpanel");
let helpFor=null,helpKind=null,PV=null,aiCtl=null,AI=null,explainN=0;
const CHAT={};
const ICON={bad:"✕",miss:"+",good:"✓"};
const L=k=>"ABCD"[k];
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br>");
const plain=h=>String(h).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
const PERSONA="Eres el búho guía de «Brújula Social», una actividad de Ciencias Sociales de Código U para estudiantes colombianos de grado 10° y 11° que se preparan para la prueba Saber 11 del ICFES. Hablas en español de Colombia, con calidez y claridad, y tuteas al estudiante. Escribe en párrafos cortos, sin títulos ni listas largas; puedes resaltar una o dos ideas con **negritas**.";
const SUGS=["¿Qué significa la escala de un problema?","Dame un ejemplo de dimensión cultural","¿Cómo descarto opciones en el ICFES?"];

function helpItems(){const x=T[S.i],h=HELP[S.i],it=[];
 if(helpKind==="free"){const q=S.fq;return [["bad",`Elegiste la <b>${L(S.fpa)}</b>. ${esc(q.wo[S.fpa]||"No es la mejor respuesta según la situación.")}`],["good",`La correcta es la <b>${L(q.a)}</b>. ${esc(q.why)}`]]}
 if(helpKind==="class"){
  if(!TP.e)it.push(["bad",`En escala marcaste <b>${S.e}</b>, pero es <b>${x.esc}</b>. ${h.en}`]);
  S.d.filter(v=>!x.dim.includes(v)).forEach(v=>it.push(["bad",`Marcaste la dimensión <b>${v}</b>. ${h.dn[v]}`]));
  x.dim.filter(v=>!S.d.includes(v)).forEach(v=>it.push(["miss",`Te faltó la dimensión <b>${v}</b>. ${h.dn[v]}`]));
  S.ac.filter(v=>!x.ac.includes(v)).forEach(v=>it.push(["bad",`Marcaste a <b>${v}</b> como actor. ${h.an[v]}`]));
  x.ac.filter(v=>!S.ac.includes(v)).forEach(v=>it.push(["miss",`Te faltó el actor <b>${v}</b>. ${h.an[v]}`]));
  const ok=[TP.e&&"la escala",TP.d&&"las dimensiones",TP.a&&"los actores"].filter(Boolean);
  if(ok.length)it.push(["good",`Acertaste ${ok.join(" y ").replace(/ y (?=.* y )/,", ")}. ¡Bien!`])}
 else it.push(["bad",`Elegiste la <b>${L(S.pa)}</b>. ${h.wo[S.pa]}`],["good",`La correcta es la <b>${L(x.a)}</b>. ${x.why}`]);
 return it}
const ctx=(withQ=true)=>{if(S.st==="free"&&S.fq){const q=S.fq;return `PREGUNTA ${q.n} (${q.tipo}; ${COMP[q.comp]}): «${q.tema}»\nSITUACIÓN: ${q.ctx.join(" ")}`+(q.cita?`\nCita de ${q.cita.autor}: «${q.cita.texto}»`:"")+(q.tabla?`\nTabla: ${q.tabla.cols.join(" | ")}; ${q.tabla.filas.map(r=>r.join(" | ")).join("; ")}`:"")+`\nPREGUNTA: ${q.q}\n${q.o.map((o,k)=>L(k)+". "+o).join("\n")}`}const x=T[S.i];return `CASO ${S.i+1}: «${x.t}» (${x.tipo})\nFUENTE: ${plain(x.f)}`+(withQ?`\nPREGUNTA TIPO SABER 11: ${x.q}\n${x.o.map((o,k)=>L(k)+". "+o).join("\n")}`:"")};
const stage=()=>S.st==="free"?"q":S.ph===0?"c":"q";
const where=()=>S.st==="free"&&S.fq?`Pregunta ${S.fq.n}`:`Caso ${S.i+1}`;
const helpHere=()=>!!helpKind&&(S.st==="play"?helpFor===S.i:S.st==="free"&&!!S.fq&&helpFor==="f"+S.fq.n);
const hintsLeft=()=>S.hints?2-S.hints[stage()]:0;
const hintBtn=()=>{const l=hintsLeft();return `<button class="btn ai sm" data-a="hint" ${l>0?"":"disabled"}>✦ Pedir una pista al búho ${l>0?`(queda${l>1?"n":""} ${l})`:"(ya usaste tus pistas)"}</button>`};
const chatKey=()=>S.st==="play"?"c"+S.i:S.st==="free"&&S.fq?"f"+S.fq.n:"general";

function chatLogHTML(){const log=CHAT[chatKey()]||[];
 const intro=`<div class="msg owl"><p>¡Hola! Pregúntame lo que quieras sobre ${S.st==="play"?"este caso":"Ciencias Sociales y el Saber 11"}. Te ayudo a razonar.</p><p><b>Consejo:</b> ${TIPS[tipN++%TIPS.length]}</p></div>`;
 return intro+(log.length?log.map(m=>`<div class="msg ${m.role==="user"?"me":"owl"}"><p>${md(m.content)}</p></div>`).join(""):`<div class="sugs">${SUGS.map(s=>`<button class="sug" data-h="sug">${s}</button>`).join("")}</div>`)}

function panelHTML(){let eyebrow="",title="",body="",foot="";
 const tabs=AI&&helpHere()&&(PV==="help"||PV==="chat");
 if(PV==="help"){eyebrow=`${where()} · ${helpKind==="class"?"Ubicación":"Pregunta"}`;title=helpKind==="class"?"Revisemos cómo ubicaste el caso":"¿Por qué no era esa opción?";
  body=helpItems().map((r,k)=>`<div class="hp-item ${r[0]}" style="--i:${k}"><i aria-hidden="true">${ICON[r[0]]}</i><p>${r[1]}</p></div>`).join("")+`<div class="hp-ai" id="aiOut" hidden></div>`;
  foot=(AI?`<button class="btn ai" data-h="explain">✦ Explícamelo con otras palabras</button>`:"")+`<button class="btn alt" data-h="close">Entendido</button>`}
 else if(PV==="hint"){eyebrow=`${where()} · Pista`;title="Una pista del búho";
  body=`<div class="hint-list" id="hintList">${S.hintTexts[stage()].map(t=>`<div class="hp-ai"><p>${md(t)}</p></div>`).join("")}</div>`;
  foot=hintFoot()}
 else{eyebrow=S.st==="play"||S.st==="free"?`${where()} · Chat con IA`:"Chat con IA";title="Pregúntale al búho";
  body=`<div class="chat" id="chatLog">${chatLogHTML()}</div>`;
  foot=`<form class="ask" id="askForm"><input id="askIn" type="text" maxlength="300" autocomplete="off" placeholder="Escribe tu pregunta…" aria-label="Tu pregunta para el búho"><button class="btn" type="submit">Enviar</button></form>`}
 return `<header class="hp-head"><div class="moon">${OWL(true)}</div><div><small>${eyebrow}</small><h4 id="hp-title">${title}</h4></div><button class="hp-x" data-h="close" aria-label="Cerrar">×</button></header>
${tabs?`<nav class="hp-tabs"><button data-h="tab-help" class="${PV==="help"?"on":""}">Explicación</button><button data-h="tab-chat" class="${PV==="chat"?"on":""}">✦ Pregúntale al búho</button></nav>`:""}
<div class="hp-body" id="hpBody">${body}</div><footer class="hp-foot">${foot}</footer>`}
const hintFoot=()=>{const l=hintsLeft();return (l>0?`<button class="btn ai" data-h="hint">✦ Otra pista (queda${l>1?"n":""} ${l})</button>`:"")+`<button class="btn alt" data-h="close">Entendido</button>`};

function openPanel(view,pop=true){abortAI();PV=view;hideBubble();P.innerHTML=panelHTML();P.classList.remove("out","pop");P.hidden=false;
 if(pop){void P.offsetWidth;P.classList.add("pop")}
 H.dataset.mood=view==="help"?"worried":"";
 const f=view==="chat"?document.getElementById("askIn"):P.querySelector(".hp-foot .btn");if(f)f.focus({preventScroll:true});
 if(view==="chat")scrollPanel()}
function openHelp(kind){helpFor=S.st==="free"?"f"+S.fq.n:S.i;helpKind=kind;explainN=0;openPanel("help")}
function closePanel(){abortAI();if(P.hidden)return;H.dataset.mood="";if(calm()){P.hidden=true;return}
 P.classList.remove("pop");P.classList.add("out");setTimeout(()=>{P.hidden=true;P.classList.remove("out")},220)}
function scrollPanel(){const b=document.getElementById("hpBody");if(b)b.scrollTop=b.scrollHeight}

/* ---------- IA (capacidad sample) ---------- */
function abortAI(){if(aiCtl){aiCtl.abort();aiCtl=null}}
function aiErr(e){const c=e&&e.code;
 if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){AI=null;setTimeout(aiGone,0);return "La IA del búho no está disponible en esta cuenta. Igual te sigo ayudando con mis explicaciones."}
 if(c==="rate_limited")return "El búho está pensando mucho. Intenta de nuevo en un momento.";
 if(c==="session_expired")return "Tu sesión de Claude expiró. Vuelve a iniciar sesión para usar la IA.";
 if(c==="refused")return "No puedo responder eso. Pregúntame algo sobre el caso o sobre Sociales.";
 return "Se cortó la conexión. Toca el botón otra vez para reintentar."}
function aiGone(){P.querySelectorAll("[data-h=explain],[data-h=hint]").forEach(b=>b.remove());const f=document.getElementById("askForm");if(f)f.remove();
 if(S.st==="play"||S.st==="free"){const y=scrollY;render(true);scrollTo(0,y)}}
async function stream(input,el,cache=true){abortAI();const ctl=aiCtl=new AbortController(),ow=document.getElementById("howl");
 el.hidden=false;el.classList.add("thinking");el.innerHTML='<p><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span> El búho está pensando…</p>';ow.classList.add("thinking");scrollPanel();
 try{const r=await AI(input,{modelTier:"quick",signal:ctl.signal,cache,onText:({text})=>{el.classList.remove("thinking");el.innerHTML="<p>"+md(text)+'<span class="caret"></span></p>';scrollPanel()}});
  el.classList.remove("thinking");el.innerHTML="<p>"+md(r.text)+"</p>"+(r.truncated?'<p class="mute">(La respuesta quedó recortada.)</p>':"");scrollPanel();return r.text}
 catch(e){if(e&&e.code==="cancelled")return null;el.classList.remove("thinking");
  el.innerHTML=(e&&e.text?"<p>"+md(e.text)+"</p>":"")+`<p class="ai-err">${aiErr(e)}</p>`;scrollPanel();return null}
 finally{if(aiCtl===ctl)aiCtl=null;ow.classList.remove("thinking")}}

async function runExplain(btn){if(!AI)return;const x=T[S.i];btn.disabled=true;
 const fq=S.fq,what=helpKind==="free"
  ?`El estudiante eligió la opción ${L(S.fpa)}. La correcta es la ${L(fq.a)}.\nPor qué su opción es incorrecta: ${fq.wo[S.fpa]}\nPor qué la correcta sí lo es: ${fq.why}`
  :helpKind==="class"
  ?`El estudiante debía ubicar el caso. Marcó: escala ${S.e}; dimensiones ${S.d.join(", ")}; actores ${S.ac.join(", ")}.\nLo correcto era: escala ${x.esc}; dimensiones ${x.dim.join(", ")}; actores ${x.ac.join(", ")}.\nExplicación base: ${x.ex}\nNotas de sus errores: ${plain(helpItems().filter(r=>r[0]!=="good").map(r=>r[1]).join(" "))}`
  :`El estudiante eligió la opción ${L(S.pa)}. La correcta es la ${L(x.a)}.\nPor qué su opción es incorrecta: ${HELP[S.i].wo[S.pa]}\nPor qué la correcta sí lo es: ${x.why}`;
 const n=++explainN,prompt=`${PERSONA}\n\n${ctx()}\n\n${what}\n\nExplícale con otras palabras${n>1?", de una forma distinta a la anterior,":""} y con un ejemplo de la vida cotidiana en Colombia por qué se equivocó y cómo pensarlo la próxima vez. Sé amable: equivocarse es parte de aprender. Máximo 110 palabras.`;
 await stream(prompt,document.getElementById("aiOut"),n===1);
 if(btn.isConnected){btn.disabled=explainN>=3;btn.textContent=explainN>=3?"✦ Ya te lo expliqué de varias formas":"✦ Explícamelo de otra forma"}}

async function runHint(){if(!AI)return;const k=stage();if(hintsLeft()<=0)return;
 S.hints[k]++;const n=S.hints[k],x=T[S.i],prev=S.hintTexts[k];
 document.querySelectorAll("#app [data-a=hint]").forEach(b=>b.outerHTML=hintBtn());
 const foot=P.querySelector(".hp-foot");if(foot&&PV==="hint")foot.innerHTML=hintFoot();
 const task=k==="c"
  ?`El estudiante está en el paso 1: debe ubicar el caso según su escala (Local, Nacional o Global), sus dimensiones (Política, Económica, Cultural, Ambiental; puede haber varias) y sus actores (opciones: ${x.ao.join("; ")}). NO digas cuál es la escala correcta ni qué dimensiones o actores son correctos o incorrectos, y no descartes ninguno.`
  :`El estudiante está en el paso 2: debe responder la pregunta tipo Saber 11. NO digas cuál opción es la correcta, no menciones letras de opciones y no descartes ninguna.`;
 const prompt=`${PERSONA}\n\n${ctx(k==="q")}\n\n${task}\nDale la pista número ${n} de 2${n>1?", un poco más concreta que la anterior":""}: una pregunta guía o una idea que lo haga releer una parte específica de la fuente. Máximo 55 palabras.`+(prev.length?`\nPistas que ya le diste (no las repitas): ${prev.join(" | ")}`:"");
 const el=document.createElement("div");el.className="hp-ai";const list=document.getElementById("hintList");if(!list)return;list.appendChild(el);
 const t=await stream(prompt,el,false);if(t)prev.push(t)}

async function sendChat(q){if(!AI||aiCtl)return;const key=chatKey(),log=CHAT[key]=CHAT[key]||[],x=S.st==="play"?T[S.i]:null;
 log.push({role:"user",content:q});const box=document.getElementById("chatLog");if(!box)return;
 const sg=box.querySelector(".sugs");if(sg)sg.remove();
 box.insertAdjacentHTML("beforeend",`<div class="msg me"><p>${md(q)}</p></div>`);
 const el=document.createElement("div");el.className="msg owl";box.appendChild(el);
 const inp=document.getElementById("askIn");if(inp)inp.value="";
 let rules=PERSONA+"\n\n";
 if(S.st==="free"&&S.fq){rules+=ctx()+"\n\n"+(S.fpa==null
  ?"Todavía no ha respondido: NO reveles la letra correcta ni descartes opciones, aunque te lo pida. Ayúdale a razonar con preguntas y ejemplos."
  :`Ya respondió. La respuesta correcta es la ${L(S.fq.a)}. Puedes explicarla si te lo pide.`)+"\n\n"}
 if(x){const loc=`La ubicación correcta del caso es: escala ${x.esc}; dimensiones ${x.dim.join(", ")}; actores ${x.ac.join(", ")}.`;
  rules+=ctx()+"\n\n"+(S.ph===0
  ?"Todavía no ha ubicado el caso ni respondido la pregunta: NO reveles la escala, las dimensiones ni los actores correctos, ni la letra correcta de la pregunta, aunque te lo pida. Ayúdale a razonar con preguntas y ejemplos."
  :S.ph===1
  ?`Ya comprobó la ubicación. ${loc} Puedes explicarla. Todavía NO ha respondido la pregunta tipo Saber 11: no reveles su letra correcta ni descartes opciones, aunque te lo pida; ayúdale a razonar.`
  :`Ya terminó este caso. ${loc} La respuesta correcta de la pregunta es la ${L(x.a)}. Puedes explicarla si te lo pide.`)+"\n\n"}
 rules+="Responde solo sobre Ciencias Sociales, este caso y la preparación para el Saber 11; si te preguntan otra cosa, redirige con amabilidad. Máximo 90 palabras por respuesta. Las siguientes son las preguntas del estudiante.";
 const t=await stream([{role:"user",content:rules},...log.slice(-7)],el,false);
 if(t)log.push({role:"assistant",content:t})}

H.addEventListener("click",e=>{const h=e.target.closest("[data-h]");
 if(h){const a=h.dataset.h;
  if(a==="close"){const was=PV;closePanel();if(was==="help")helperSay("¡Tú puedes! Sigue adelante.","ok",3500);return}
  if(a==="explain"){runExplain(h);return}
  if(a==="hint"){runHint();return}
  if(a==="tab-help"){openPanel("help",false);return}
  if(a==="tab-chat"){openPanel("chat",false);return}
  if(a==="sug"){sendChat(h.textContent);return}}
 if(e.target.closest("#hbub")){hideBubble();return}
 if(e.target.closest("#howl")){land();
  if(!P.hidden){closePanel();return}
  if(helpHere()){openPanel("help");return}
  if(AI){openPanel("chat");return}
  helperSay("<b>Consejo:</b> "+TIPS[tipN++%TIPS.length])}});
H.addEventListener("submit",e=>{e.preventDefault();const i=document.getElementById("askIn"),v=i&&i.value.trim();if(v)sendChat(v)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePanel()});
/* El búho termina de armarse: golpe de luna, anillo y ráfaga de plumas y chispas */
function assembled(){if(S.st!=="splash"||calm())return;const sc=document.querySelector(".splash .scene");if(!sc)return;sc.classList.add("kick");
 const r=sc.getBoundingClientRect();burstAt(r.left+r.width/2,r.top+r.height*.55,26,r.width*.75)}
function confetti(){if(calm())return;const c=document.createElement("div");c.className="confetti";const cols=["var(--gold)","var(--owl-gold)","var(--ink)","var(--t-pol)","var(--t-eco)","var(--t-cul)","var(--t-amb)"];
 for(let k=0;k<70;k++){const i=document.createElement("i");i.style.cssText=`left:${Math.random()*100}%;background:${cols[k%cols.length]};--t:${2.4+Math.random()*1.8}s;--d:${Math.random()*.8}s`;c.appendChild(i)}
 document.body.appendChild(c);setTimeout(()=>c.remove(),5200)}
function countUp(){const el=document.querySelector(".score[data-count]");if(!el||calm())return;const tgt=+el.dataset.count,sm=el.querySelector("small").outerHTML,t0=performance.now();
 (function f(t){const p=Math.min(1,(t-t0)/900);el.innerHTML=Math.round(tgt*(1-Math.pow(1-p,3)))+sm;if(p<1)requestAnimationFrame(f)})(t0)}

/* ---------- Render ---------- */
let splashTimer=null;
function render(quiet){const showH=S.st!=="splash"&&S.st!=="teacher"&&H.dataset.ready==="1";H.hidden=!showH;document.body.classList.toggle("has-helper",showH);
 if(S.st==="teacher"){particles(false);teacher();return}
 document.body.classList.toggle("cover",S.st==="splash"||S.st==="reg");
 const key=viewKey();const changed=key!==lastKey;lastKey=key;
 $a.className=changed&&!quiet?"enter":"";
 $a.innerHTML=({splash,reg,mode,intro,play,end,free,score}[S.st])()+(S.st==="splash"?"":foot());
 if(changed&&!quiet){window.scrollTo(0,0);if(!flying&&showH)setTimeout(greet,450)}
 if(S.st==="end"&&changed){countUp();if(S.pts/(T.length*5)>=.8)confetti()}
 if(S.pts!=null){if(S.pts>shownPts){const p=$a.querySelector(".pill");if(p&&!calm())p.classList.add("bump")}shownPts=S.pts}
 particles(["reg","mode","intro","end","score"].includes(S.st));
 if(S.st==="score"&&changed){countNum($a.querySelector(".g-num b"));if(freeStats().level===4)confetti()}
 fx=null}
let shownPts=0;

/* Partículas doradas de fondo (como en Código U) */
function particles(on){let el=document.getElementById("particles");
 if(!on||calm()){if(el)el.remove();return}
 if(el)return;el=document.createElement("div");el.id="particles";el.className="particles";el.setAttribute("aria-hidden","true");
 for(let k=0;k<22;k++){const i=document.createElement("i");
  i.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--s:${3+Math.random()*5}px;--t:${7+Math.random()*7}s;--d:${-Math.random()*8}s`;el.appendChild(i)}
 document.body.prepend(el)}
/* Chispas sobre las respuestas acertadas */
function sparkGood(){if(calm())return;document.querySelectorAll("#app .chip.good.fx").forEach((c,k)=>setTimeout(()=>{const r=c.getBoundingClientRect();burstAt(r.left+r.width/2,r.top+r.height/2,6,34,"spark")},k*70))}
/* Onda al tocar botones */
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn,.sug,.hp-tabs button");if(!b||b.disabled||calm())return;
 const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,s=document.createElement("span");s.className="ripple";
 s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),650)});

const A={
 skip(){flyToCorner();return true},
 course(v){S.name=document.getElementById("nm").value;S.course=v;S.err=""},
 start(){const n=document.getElementById("nm").value.trim().replace(/\s+/g," ");S.name=n;
  if(n.split(" ").length<2||n.length<5){S.err="Escribe tu nombre completo, con nombre y apellido.";return}
  if(!S.course){S.err="Elige tu curso: 10° u 11°.";return}S.err="";init();S.st="mode"},
 pick(v){S.mode=v;if(v==="free")startFree();else S.st="intro"},
 fopt(v){if(S.fpa!=null)return;const q=S.fq;S.fpa=+v;fx=1;const r=S.fpa===q.a;
  S.fh.push({tema:q.tema,competencia:q.comp,tipo:q.tipo,dificultad:q.dif,eligio:L(S.fpa),correcta:L(q.a),acierto:r,pistas:S.hints.q,origen:q.origen});
  if(r){setTimeout(feathers,350);setTimeout(()=>helperSay("<b>¡Correcto!</b> Sigue así.","ok",3500),300)}
  else{const n0=q.n;setTimeout(()=>{if(S.st==="free"&&S.fq.n===n0&&S.fpa!=null){land();openHelp("free")}},450)}
  save(false)},
 fnext(){closePanel();helpKind=null;helpFor=null;nextFree()},
 score(){closePanel();S.st="score"},
 back(){S.st="free";if(S.loading)return;if(!S.fq||S.fpa!=null)nextFree();else prefetch()},
 usebank(){S.loading=false;clearTimeout(slowT);S.fq=fromBank()},
 switch(){closePanel();cancelGen();helpKind=null;helpFor=null;init();S.st="mode"},
 go(){S.st="play"},
 e(v){S.e=v;S.lastPick=v},
 d(v){const k=S.d.indexOf(v);k<0?S.d.push(v):S.d.splice(k,1);S.lastPick=v},
 ac(v){const k=S.ac.indexOf(v);k<0?S.ac.push(v):S.ac.splice(k,1);S.lastPick=v},
 check(){const x=T[S.i];TP={e:S.e===x.esc,d:sameSet(S.d,x.dim),a:sameSet(S.ac,x.ac)};S.pts+=TP.e+TP.d+TP.a;S.ph=1;fx=1;S.lastPick=null;setTimeout(sparkGood,120);
  const n=TP.e+TP.d+TP.a;
  if(n===3){setTimeout(feathers,350);setTimeout(()=>helperSay("<b>¡Perfecto!</b> Ubicaste muy bien el caso. +3 puntos.","ok"),300)}
  else{const i0=S.i;setTimeout(()=>{if(S.st==="play"&&S.i===i0&&S.ph===1){land();openHelp("class")}},450)}},
 opt(v){const x=T[S.i];S.pa=+v;S.ph=2;fx=1;const r=S.pa===x.a;
  if(r){S.pts+=2;setTimeout(feathers,350);setTimeout(()=>helperSay("<b>¡Correcto!</b> +2 puntos. Vas muy bien.","ok"),300)}
  else{const i0=S.i;setTimeout(()=>{if(S.st==="play"&&S.i===i0&&S.ph===2){land();openHelp("q")}},450)}
  S.res.push({escala:S.e,dimensiones:S.d.slice(),actores:S.ac.slice(),pregunta:"ABCD"[S.pa],pe:+TP.e,pd:+TP.d,pa:+TP.a,pp:+r,pistas:S.hints.c+S.hints.q});save(false)},
 next(){closePanel();helpKind=null;helpFor=null;if(S.i<T.length-1){S.i++;Object.assign(S,{ph:0,e:null,d:[],ac:[],pa:null,hints:{c:0,q:0},hintTexts:{c:[],q:[]}});TP={}}else{S.st="end";save(true)}},
 again(){closePanel();cancelGen();helpKind=null;helpFor=null;S={st:"reg",name:"",course:"",err:""};saved="local";TP={}},
 teacher(){if(TEACH)S.st="teacher"},
 hint(){if(AI){openPanel("hint");runHint()}return true},
 csv(){csv();return true}
};
const quietActs=new Set(["course","e","d","ac","check","opt","fopt"]);
const navActs=new Set(["start","go","next","again","teacher","pick","fnext","score","back","switch","usebank"]);
$a.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const act=b.dataset.a;if(!A[act])return;
 const before=viewKey()+":"+S.ph;
 if(A[act](b.dataset.i))return;
 /* Salida suave antes de cambiar de pantalla */
 if(navActs.has(act)&&before!==viewKey()+":"+S.ph&&!calm()){$a.classList.add("leave");setTimeout(()=>render(),190);return}
 const keepY=quietActs.has(act)?scrollY:null;render(quietActs.has(act));if(keepY!==null)window.scrollTo(0,keepY)});
$a.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="nm"){A.start();render()}
 else if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.a==="skip"){e.preventDefault();A.skip()}});

H.dataset.ready="1";
render();
setTimeout(assembled,3150);
splashTimer=setTimeout(flyToCorner,7000);
</script>
