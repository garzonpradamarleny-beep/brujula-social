<meta charset="utf-8">
<title>Brújula Social</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Gelasio:ital,wght@0,600;0,700;1,500&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: una columna central de 640px; portada crema con el búho sobre una luna-brújula, luego tarjetas blancas sobre fondo cálido (sistema Código U). */
:root{
  --bg:#f7f5ef; --cream:#f4ead3; --surface:#ffffff; --ink:#161618; --muted:#6b6e76; --line:#e8e3d7;
  --gold:#c9962c; --gold-ink:#8f671d; --gold-soft:#f5ecd8; --gold-glow:rgba(201,150,44,.28);
  --btn:#161618; --btn-ink:#f4ead3;
  --good:#3d7a55; --good-bg:#e4f0e7; --bad:#b0464b; --bad-bg:#f8e4e4;
  --t-pol:#9271b9; --t-eco:#5b86b5; --t-cul:#b7718f; --t-amb:#5f9272;
  --moon-a:#fffaf0; --moon-b:#f4e8cf; --moon-c:#e2cfa6; --moon-d:#c9ad74;
  --owl:#121314; --owl-gold:#e0ac30;
  --shadow:0 1px 2px rgba(22,22,24,.05),0 8px 24px rgba(22,22,24,.06);
  --f-display:"Gelasio",Georgia,"Times New Roman",serif;
  --f-body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --f-ui:"Manrope","DM Sans","Segoe UI",system-ui,sans-serif;
  --radius:.75rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121314; --cream:#17171a; --surface:#1d1e21; --ink:#f2ead8; --muted:#a6a39b; --line:#2d2d31;
  --gold:#e0ac30; --gold-ink:#e7bd65; --gold-soft:#2a2416; --gold-glow:rgba(231,189,101,.25);
  --btn:#f2ead8; --btn-ink:#161618;
  --good:#86c9a0; --good-bg:#1b2b21; --bad:#ec8f93; --bad-bg:#35201f;
  --t-pol:#b79ad9; --t-eco:#8fb2da; --t-cul:#dc9bb8; --t-amb:#8fc1a0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121314; --cream:#17171a; --surface:#1d1e21; --ink:#f2ead8; --muted:#a6a39b; --line:#2d2d31;
  --gold:#e0ac30; --gold-ink:#e7bd65; --gold-soft:#2a2416; --gold-glow:rgba(231,189,101,.25);
  --btn:#f2ead8; --btn-ink:#161618;
  --good:#86c9a0; --good-bg:#1b2b21; --bad:#ec8f93; --bad-bg:#35201f;
  --t-pol:#b79ad9; --t-eco:#8fb2da; --t-cul:#dc9bb8; --t-amb:#8fc1a0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
body.cover{background:var(--cream)}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}

/* ---------- Marca ---------- */
.wordmark{font:700 clamp(30px,7vw,40px)/1.05 var(--f-display);letter-spacing:.14em;text-transform:uppercase;text-align:center}
.wordmark span{color:var(--gold)}
.lema{font:italic 500 16px/1.4 var(--f-display);text-align:center;color:var(--ink);opacity:.86}
.eyebrow{font:700 11px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.mute{color:var(--muted);font-size:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:700 15px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.brand span{color:var(--gold)}
.pill{font:700 13px/1 var(--f-ui);padding:8px 12px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Búho (SVG de Código U) ---------- */
.owl svg{display:block;width:100%;height:auto;overflow:visible}
.owl-ink{fill:var(--owl)}
.owl-gold-fill{fill:var(--owl-gold)}
.owl-gold-shine{mix-blend-mode:screen}
.moon{border-radius:50%;background:radial-gradient(circle at 42% 38%,var(--moon-a) 0%,var(--moon-b) 48%,var(--moon-c) 72%,var(--moon-d) 100%);display:grid;place-items:center}
.ava{width:44px;height:44px;flex:none;box-shadow:0 0 0 3px var(--surface)}
.ava .owl{width:24px;margin-top:4px}
.mini{width:30px;height:30px}
.mini .owl{width:16px;margin-top:3px}

/* Escena de la portada: luna, anillo-brújula y búho */
.scene{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:8px auto 0}
.scene .moon{position:absolute;inset:14%;box-shadow:0 0 50px 6px var(--gold-glow)}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--gold-glow)}
.ring b{position:absolute;font:800 11px/1 var(--f-ui);color:var(--gold-ink);letter-spacing:.06em}
.ring b:nth-child(1){top:-6px;left:50%;translate:-50%}
.ring b:nth-child(2){bottom:-6px;left:50%;translate:-50%}
.ring b:nth-child(3){right:-4px;top:50%;translate:0 -50%}
.ring b:nth-child(4){left:-6px;top:50%;translate:0 -50%}
.ring i{position:absolute;top:9%;left:13%;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px 4px var(--gold-glow)}
.scene .owl{position:absolute;left:50%;bottom:6%;width:46%;translate:-50%;filter:drop-shadow(0 14px 14px rgba(0,0,0,.25))}

/* ---------- Splash ---------- */
.splash{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;cursor:pointer;text-align:center}
.splash .scene{width:min(320px,78vw)}
.skip{font:600 10px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.skip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}

/* ---------- Tarjetas y formularios ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font:700 17px/1.3 var(--f-ui)}
label,.lbl{font:700 13px/1.2 var(--f-ui);color:var(--ink)}
input[type=text]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 16px var(--f-body)}
input[type=text]:focus-visible{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.err{color:var(--bad);font-size:14px;font-weight:600}
.field{display:flex;flex-direction:column;gap:8px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font:600 14px/1 var(--f-ui);cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip:active:not(:disabled){transform:scale(.96)}
.chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip.good{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.chip.miss{border-style:dashed;border-color:var(--good);color:var(--good)}
.chip:disabled{cursor:default}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}

.btn{position:relative;overflow:hidden;align-self:stretch;border:0;border-radius:999px;background:var(--btn);color:var(--btn-ink);padding:15px 22px;font:700 15px/1 var(--f-ui);letter-spacing:.02em;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.shine::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-150%)}
.link{background:none;border:0;color:var(--muted);font:600 13px var(--f-ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}

/* Burbuja del búho */
/* Nota de explicación dentro de la página (el búho habla desde la esquina) */
.say p{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--radius);padding:13px 16px;font-size:15px;box-shadow:var(--shadow);min-width:0}
.say.ok p{background:var(--good-bg);border-color:transparent;border-left-color:var(--good)}
.say.no p{background:var(--gold-soft);border-color:transparent;border-left-color:var(--gold)}

/* Aguja de brújula en la portada de registro */
.needle{position:absolute;left:50%;top:50%;width:54%;translate:-50% -50%;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}

/* ---------- Búho ayudante ---------- */
#helper{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30}
.h-owl{position:relative;display:grid;place-items:center;width:72px;height:72px;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 4px var(--bg),0 10px 26px rgba(0,0,0,.22),0 0 30px 4px var(--gold-glow);transition:transform .2s}
.h-owl:hover{transform:scale(1.06)}
.h-owl .owl{width:40px;margin-top:6px}
.h-owl.ghost{opacity:0}
.h-bubble{position:absolute;left:4px;bottom:88px;width:max-content;max-width:min(330px,calc(100vw - 40px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:15px;line-height:1.45;box-shadow:var(--shadow);cursor:pointer;transform-origin:10% 100%}
.h-bubble::after{content:"";position:absolute;left:22px;bottom:-7px;width:12px;height:12px;background:inherit;border-right:1px solid var(--line);border-bottom:1px solid var(--line);rotate:45deg}
.h-bubble.ok{background:var(--good-bg);border-color:transparent}
.h-bubble.no{background:var(--gold-soft);border-color:transparent}
.h-bubble b{font-family:var(--f-ui)}
#helper[data-mood="worried"] .owl-head{animation:none;transform:rotate(-13deg) translateY(6px)}
.owl-head{transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.flyer{position:fixed;left:0;top:0;z-index:40;pointer-events:none;transform-origin:0 0;filter:drop-shadow(0 0 1.4px var(--moon-b)) drop-shadow(0 0 7px var(--gold-glow)) drop-shadow(0 14px 14px rgba(0,0,0,.25))}
body.has-helper{padding-bottom:128px}
/* Panel de ayuda del búho */
.h-panel{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(102px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 32px));max-height:min(64vh,580px);display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden;transform-origin:6% 100%}
.hp-head{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;background:var(--gold-soft)}
.hp-head .moon{width:38px;height:38px;flex:none}
.hp-head .moon .owl{width:21px;margin-top:3px}
.hp-head div{flex:1;min-width:0}
.hp-head small{display:block;font:700 10px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:4px}
.hp-head h4{margin:0;font:700 16px/1.25 var(--f-display)}
.hp-x{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--ink);font:500 22px/1 var(--f-ui);cursor:pointer}
.hp-x:hover{background:var(--surface)}
.hp-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.hp-item{display:flex;gap:11px;font-size:14.5px;line-height:1.5}
.hp-item i{flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 var(--f-ui);font-style:normal}
.hp-item.bad i{background:var(--bad-bg);color:var(--bad)}
.hp-item.miss i{border:1.5px dashed var(--good);color:var(--good)}
.hp-item.good i{background:var(--good-bg);color:var(--good)}
.hp-item b{font-family:var(--f-ui)}
.hp-foot{padding:12px 16px 16px;border-top:1px solid var(--line)}
.hp-foot .btn{width:100%;padding:13px}
@media (max-width:520px){.h-panel{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}
/* IA del búho: botones dorados, respuestas en vivo, pistas y chat */
.btn.ai{background:linear-gradient(100deg,var(--gold) 0%,#f1cf7a 50%,var(--gold) 100%);background-size:220% 100%;color:#161618}
.btn.ai.sm{padding:12px 18px;font-size:14px}
.btn.ai:disabled{opacity:.45}
.hp-foot{display:flex;flex-direction:column;gap:8px}
.hp-tabs{display:flex;gap:4px;padding:6px 12px 0;border-bottom:1px solid var(--line)}
.hp-tabs button{flex:1;border:0;background:none;padding:10px 6px;font:700 13px/1.2 var(--f-ui);color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;transition:color .2s,border-color .2s}
.hp-tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.hp-ai{background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.55}
.hp-ai::before{content:"✦ Respuesta con IA";display:block;font:700 10px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:8px}
.hp-ai p,.msg p{margin:0}
.hp-ai p+p,.msg p+p{margin-top:8px}
.hint-list{display:flex;flex-direction:column;gap:10px}
.dots{display:inline-flex;gap:4px;margin-right:6px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.caret{display:inline-block;width:7px;height:15px;margin-left:3px;vertical-align:-2px;border-radius:2px;background:var(--gold)}
.ai-err{color:var(--bad);font-weight:600;font-size:14px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:180px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--btn);color:var(--btn-ink);border-bottom-right-radius:4px}
.msg.owl{align-self:flex-start;background:var(--gold-soft);border-bottom-left-radius:4px}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sug{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 12.5px/1.2 var(--f-ui);cursor:pointer;text-align:left}
.sug:hover{border-color:var(--gold)}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;padding:12px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px var(--f-body)}
.ask input:focus-visible{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.hp-foot .ask .btn{width:auto;padding:12px 18px}

/* ---------- Fase 5: detalles de movimiento y pulido ---------- */
#app{position:relative;z-index:1}
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particles i{position:absolute;width:var(--s,5px);height:var(--s,5px);border-radius:50%;background:var(--gold);opacity:.18;box-shadow:0 0 10px 2px var(--gold-glow)}
.wordmark span{background:linear-gradient(90deg,var(--gold) 0%,#f1cf7a 45%,var(--gold) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.card{transition:translate .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
@media (hover:hover){.card:hover{translate:0 -2px;box-shadow:0 2px 4px rgba(22,22,24,.05),0 16px 36px rgba(22,22,24,.10),0 0 0 1px var(--gold-glow)}}
.btn,.sug,.hp-tabs button{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;pointer-events:none;transform:scale(0)}
.steps i{position:relative;overflow:hidden}
.pill{display:inline-block}
.trophy-row{display:flex;flex-direction:column;align-items:center;gap:10px}
.trophy{width:76px;height:76px;filter:drop-shadow(0 8px 14px var(--gold-glow))}
.stars{display:flex;gap:8px}
.stars svg{width:30px;height:30px}
.stars path{fill:var(--line)}
.stars .on path{fill:var(--gold)}
/* Modos, práctica ilimitada y puntaje */
.h-display{font:700 clamp(24px,5.4vw,30px)/1.2 var(--f-display)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.mode-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;font:inherit;position:relative;overflow:hidden;transition:translate .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .3s}
.mode-card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,var(--gold-glow) 50%,transparent 70%);background-size:250% 100%;background-position:120% 0;opacity:0;transition:opacity .3s;pointer-events:none}
@media (hover:hover){.mode-card:hover{translate:0 -4px;border-color:var(--gold);box-shadow:0 18px 40px rgba(22,22,24,.14),0 0 0 1px var(--gold-glow)}.mode-card:hover::after{opacity:1}}
.mode-ico{display:grid;place-items:center;width:58px;height:58px;border-radius:16px;background:var(--gold-soft);color:var(--ink)}
.mode-ico svg{width:38px;height:38px;overflow:visible}
.mode-t{font:700 21px/1.2 var(--f-display)}
.mode-d{font-size:14.5px;line-height:1.5;color:var(--muted)}
.mode-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.mode-tags i{font:700 11.5px/1 var(--f-ui);font-style:normal;padding:6px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.pill-btn{border:0;cursor:pointer;transition:background .2s}
.pill-btn:hover{background:var(--gold);color:#161618}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
.q-stem{font:600 16.5px/1.5 var(--f-body)}
.src blockquote .cite{display:block;margin-top:6px;font:600 12px/1.3 var(--f-ui);font-style:normal;color:var(--muted)}
.gauge-wrap{position:relative;width:min(220px,62vw);aspect-ratio:1;margin:0 auto}
.gauge{width:100%;height:100%;rotate:-90deg}
.gauge circle{fill:none;stroke-width:10}
.g-track{stroke:var(--line)}
.g-fill{stroke:var(--gold);stroke-linecap:round;filter:drop-shadow(0 0 6px var(--gold-glow))}
.g-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.g-num b{font:700 clamp(54px,15vw,72px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.g-num small{font:700 12px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.level{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 18px;border-radius:16px;margin:0 auto;max-width:440px}
.level b{font:800 13px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;padding:7px 14px;border-radius:999px}
.level span{font-size:14.5px;line-height:1.45}
.lv1{background:var(--bad-bg)}.lv1 b{background:var(--bad);color:var(--surface)}
.lv2{background:var(--gold-soft)}.lv2 b{background:var(--gold);color:#161618}
.lv3{background:var(--gold-soft)}.lv3 b{background:var(--t-eco);color:#fff}
.lv4{background:var(--good-bg)}.lv4 b{background:var(--good);color:var(--surface)}
.tnum{font-variant-numeric:tabular-nums}
.cbar{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font:600 14px/1.3 var(--f-ui);font-variant-numeric:tabular-nums}
.cbar div{grid-column:1/-1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.cbar div i{display:block;height:100%;border-radius:inherit;background:var(--gold);transform-origin:left}
.badge-ai{align-self:flex-start;font:700 11px/1 var(--f-ui);letter-spacing:.06em;padding:6px 10px;border-radius:999px;background:linear-gradient(100deg,var(--gold) 0%,#f1cf7a 50%,var(--gold) 100%);background-size:220% 100%;color:#161618}
.loading-q{gap:14px}

#app.leave{opacity:0;transform:translateY(-8px);transition:opacity .18s ease-in,transform .18s ease-in}
tbody tr{--i:0}
@media (max-width:520px){.h-owl{width:60px;height:60px}.h-owl .owl{width:33px;margin-top:5px}.h-bubble{bottom:74px;font-size:14px}}

/* Guía */
.guide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.guide .card{padding:16px;gap:6px;font-size:14px}
.guide .wide{grid-column:1/-1}
.guide b{font-family:var(--f-ui)}
.dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.dims div{display:flex;gap:8px;align-items:baseline}
.dims i{flex:none;width:9px;height:9px;border-radius:50%;translate:0 1px}
@media (max-width:520px){.guide,.dims{grid-template-columns:1fr}}

/* Progreso */
.steps{display:flex;gap:8px}
.steps i{flex:1;height:6px;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--ink)}
.steps i.cur{background:var(--gold)}
.meta{display:flex;justify-content:space-between;gap:10px;font:600 13px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}

/* Fuente */
.src{gap:14px}
.src h2{font:700 clamp(21px,4.6vw,25px)/1.25 var(--f-display)}
.src p{font-size:16px;max-width:62ch}
.src blockquote{margin:0;padding:4px 0 4px 16px;border-left:3px solid var(--gold);font:italic 500 16px/1.55 var(--f-display)}
.src .cite{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font:500 14px/1.3 var(--f-ui);font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}

.q{font-weight:500}
.opt{display:flex;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;font:400 15px/1.45 var(--f-body);transition:border-color .2s,background .2s}
.opt b{font:800 14px/1.45 var(--f-ui);color:var(--gold-ink);flex:none}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.good{background:var(--good-bg);border-color:var(--good)}
.opt.good b{color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad b{color:var(--bad)}
.opt:disabled{cursor:default}

/* Resultados */
.score{text-align:center;font:700 clamp(64px,18vw,96px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.score small{font-size:.32em;color:var(--muted);font-weight:600}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:12px;align-items:center;font:600 14px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.bar div{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar div i{display:block;height:100%;border-radius:inherit;background:var(--gold);transform-origin:left}
.bar span:last-child{text-align:right}
.center{text-align:center}
footer{text-align:center;font:600 12px/1.6 var(--f-ui);color:var(--muted);letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px}

/* Efectos */
.burst{position:fixed;width:0;height:0;pointer-events:none;z-index:20}
.burst i{position:absolute;left:-5px;top:-11px;width:10px;height:22px;border-radius:50%/75% 75% 25% 25%;background:var(--owl)}
.burst i.gold{background:linear-gradient(#ffe7a6,#d9a22b)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px}

{t:"Una tutela llega al colegio",tipo:"Noticia regional",
 f:`<p>En un municipio de Nariño, Laura, estudiante de grado décimo con discapacidad visual, llevaba un semestre presentando evaluaciones sin material en braille. Sus compañeros le leían en voz alta los exámenes y ella respondía de memoria, lo que la dejaba en desventaja frente al resto del curso. Su familia envió tres cartas al colegio y a la Secretaría de Educación municipal pidiendo el material adaptado, pero no obtuvo respuesta.</p><p>El rector explicó que el colegio no tiene presupuesto propio para comprar impresoras en braille y que esa compra depende de la Secretaría. La Secretaría, por su parte, respondió a un periódico local que los recursos para estudiantes con discapacidad «llegan tarde» y que hay otras prioridades, como reparar los techos de cuatro escuelas rurales.</p><p>Cansada de esperar, Laura interpuso una acción de tutela. Diez días después, un juez del municipio consideró vulnerados sus derechos a la educación y a la igualdad, y ordenó a la Secretaría entregar el material adaptado en un plazo máximo de un mes.</p><blockquote>«Respetamos las decisiones judiciales, pero el juez no puede decirnos en qué gastar el presupuesto», declaró la secretaria de Educación.</blockquote><p class="cite">Caso ilustrativo basado en el artículo 86 de la Constitución Política de 1991.</p>`,
 esc:"Local",dim:["Política"],ao:["Estudiante y su familia","Juez municipal","Secretaría de Educación","Congreso de la República","Empresas privadas"],ac:["Estudiante y su familia","Juez municipal","Secretaría de Educación"],
 ex:"El conflicto ocurre en un municipio y se resuelve con autoridades locales: escala local. Es un asunto político porque trata sobre derechos y sobre cómo una ciudadana los exige ante el Estado; el presupuesto aparece, pero como parte de la discusión sobre la obligación del Estado.",
 q:"De acuerdo con la Constitución de 1991, ¿cuál de las siguientes afirmaciones evalúa mejor la postura de la secretaria de Educación?",
 o:["Es acertada, porque la separación de poderes impide que un juez dé órdenes que impliquen gastos a una entidad administrativa.","No es acertada, porque cuando una entidad vulnera un derecho fundamental, el juez de tutela puede ordenarle acciones concretas para protegerlo, aunque impliquen gasto.","Es acertada, porque los derechos de las personas con discapacidad solo pueden protegerse mediante leyes aprobadas por el Congreso.","No es acertada, porque los jueces son los encargados de elaborar el presupuesto de las secretarías de educación."],a:1,
 why:"La tutela protege derechos fundamentales de forma inmediata. Si una entidad los vulnera, el juez puede ordenarle hacer algo concreto, como entregar el material, aunque eso cueste dinero. El juez no elabora el presupuesto: ordena proteger un derecho."},

{t:"Agua u oro en el páramo",tipo:"Crónica",
 f:`<p>Una empresa minera solicitó permiso para extraer oro a pocos kilómetros de un páramo de Santander. De ese páramo nacen las quebradas que abastecen de agua a dos municipios, donde viven cerca de 40.000 personas, y a más de 600 fincas que cultivan cebolla, papa y mora.</p><p>La alcaldía apoya el proyecto: la empresa promete 300 empleos directos y las regalías equivaldrían al 18 % del presupuesto municipal, que hoy no alcanza para pavimentar las vías veredales. Los campesinos y las juntas de los acueductos veredales se oponen.</p><blockquote>«Sin agua no hay cosecha, y sin cosecha no hay pueblo», dice Ramiro, presidente de la asociación de acueductos veredales.</blockquote><p>La empresa sostiene que usará tecnología moderna que «no afectará el agua» y que, como compensación, sembrará 10.000 árboles en una finca a 30 kilómetros de la mina. Un estudio de una universidad pública advierte que el páramo funciona como una esponja que regula el agua durante todo el año y que su recuperación tarda décadas. El Ministerio de Ambiente debe decidir si la zona hace parte del páramo delimitado, donde la minería está prohibida.</p>`,
 esc:"Local",dim:["Ambiental","Económica"],ao:["Empresa minera","Campesinos y acueductos veredales","Alcaldía","Ministerio de Ambiente","Organización de las Naciones Unidas"],ac:["Empresa minera","Campesinos y acueductos veredales","Alcaldía","Ministerio de Ambiente"],
 ex:"El conflicto afecta a dos municipios concretos: escala local. Cruza dos dimensiones: la ambiental (el agua del páramo) y la económica (empleos, regalías y cosechas). La ONU no aparece en el caso.",
 q:"La empresa afirma que la mina no afectará el agua porque usará tecnología moderna y sembrará 10.000 árboles. ¿Cuál de las siguientes afirmaciones cuestiona mejor ese argumento?",
 o:["Sembrar árboles en otra zona no garantiza que se mantenga la función del páramo de regular el agua que abastece a los municipios.","Las empresas mineras siempre incumplen los compromisos ambientales que adquieren con las comunidades.","La mina generará 300 empleos directos, lo que beneficiará la economía de los dos municipios.","El Ministerio de Ambiente todavía no ha decidido si la zona hace parte del páramo delimitado."],a:0,
 why:"La compensación se hace a 30 kilómetros, y el estudio dice que el páramo regula el agua y tarda décadas en recuperarse. Sembrar árboles en otro lugar no reemplaza esa función: eso debilita directamente el argumento de la empresa."},

{t:"Jóvenes sin empleo",tipo:"Tabla de datos",
 f:`<p>La tabla muestra, por región, la tasa de desempleo de los jóvenes entre 18 y 28 años, el porcentaje de ese grupo que accede a educación superior y el porcentaje de jóvenes que ni estudian ni trabajan.</p><div class="tbl"><table><thead><tr><th>Región</th><th class="n">Desempleo juvenil</th><th class="n">Acceso a ed. superior</th><th class="n">Ni estudian ni trabajan</th></tr></thead><tbody><tr><td>Andina</td><td class="n">15 %</td><td class="n">41 %</td><td class="n">21 %</td></tr><tr><td>Caribe</td><td class="n">18 %</td><td class="n">28 %</td><td class="n">27 %</td></tr><tr><td>Orinoquía-Amazonía</td><td class="n">17 %</td><td class="n">22 %</td><td class="n">29 %</td></tr><tr><td>Pacífica</td><td class="n">24 %</td><td class="n">19 %</td><td class="n">34 %</td></tr></tbody></table></div><p>El Gobierno nacional anunció un subsidio igual en todo el país para las empresas que contraten jóvenes por primera vez. Un gremio de empresarios apoya la medida y afirma que el principal obstáculo es que los jóvenes «no tienen experiencia». Los jóvenes consultados en la región Pacífica responden que allí hay pocas universidades e institutos técnicos, y que muchas empresas no tienen sedes en sus municipios.</p><p class="cite">Datos ilustrativos para la actividad.</p>`,
 esc:"Nacional",dim:["Económica"],ao:["Jóvenes de 18 a 28 años","Gobierno nacional","Empresas que contratan","Fuerzas Militares","Iglesias"],ac:["Jóvenes de 18 a 28 años","Gobierno nacional","Empresas que contratan"],
 ex:"La tabla compara regiones de todo el país y la medida es del Gobierno nacional: escala nacional. El tema es económico (empleo y formación para el trabajo). Los actores son quienes buscan empleo, quienes lo ofrecen y el Estado que diseña la política.",
 q:"Con base en la tabla y en las posturas descritas, ¿cuál de las siguientes medidas atendería mejor la situación de la región Pacífica?",
 o:["Concentrar el subsidio a la contratación en la región Andina, donde hay más jóvenes con formación para ocupar los empleos.","Ampliar la oferta de educación superior y técnica en la región y combinarla con incentivos para que las empresas contraten jóvenes allí.","Mantener el mismo subsidio en todas las regiones, sin otras medidas, porque el desempleo juvenil se explica únicamente por la falta de experiencia.","Reducir los programas de educación superior en la región, porque los datos muestran que estudiar no tiene relación con conseguir empleo."],a:1,
 why:"La Pacífica tiene el mayor desempleo, el menor acceso a educación superior y el mayor porcentaje de jóvenes que ni estudian ni trabajan; además, sus jóvenes dicen que faltan instituciones y empresas. Una medida que combine formación y empleo en la región responde a esas causas."},

{t:"Un barrio, muchas pantallas",tipo:"Artículo de opinión",
 f:`<p>En una encuesta en un colegio de Medellín, siete de cada diez estudiantes dijeron que escuchan sobre todo música de artistas extranjeros, descubierta en plataformas de streaming con sede en otros países. Las plataformas recomiendan canciones según lo que más se escucha en el mundo, y pagan a los artistas una fracción de centavo por cada reproducción.</p><blockquote>«Antes llenábamos las fiestas del barrio; ahora los muchachos no conocen el tiple. Los jóvenes de hoy no valoran lo nuestro: solo les interesa lo que viene de afuera», cuenta un músico de cuerda de la comuna.</blockquote><p>Sin embargo, un grupo de jóvenes del mismo barrio mezcló bambuco con ritmos urbanos, subió su canción a esas mismas plataformas y hoy tiene oyentes en México, España y Japón. Con lo que ganan en conciertos, dan clases gratuitas de tiple a niños de la comuna.</p><p>Otros músicos locales cuentan que, aunque perdieron presentaciones en fiestas, ahora venden sus grabaciones a turistas extranjeros que buscan «música auténtica».</p>`,
 esc:"Global",dim:["Cultural","Económica"],ao:["Jóvenes oyentes","Plataformas digitales internacionales","Músicos locales","Ministerio de Defensa","Juntas de acción comunal"],ac:["Jóvenes oyentes","Plataformas digitales internacionales","Músicos locales"],
 ex:"Aunque pasa en un barrio, el fenómeno es la globalización: plataformas y oyentes de varios países. Es cultural (gustos, identidad, tradición) y económico (de qué viven los músicos y quién controla la distribución).",
 q:"¿Qué supuesto NO justificado contiene la afirmación del músico de cuerda?",
 o:["Que los músicos locales han perdido presentaciones en las fiestas del barrio.","Que las plataformas de streaming tienen su sede en otros países.","Que todos los jóvenes prefieren solo lo extranjero, aunque el mismo texto muestra jóvenes del barrio que crean y enseñan música tradicional.","Que la música de cuerda forma parte de la tradición cultural de la región."],a:2,
 why:"El músico generaliza sobre «los jóvenes de hoy», pero el texto muestra jóvenes que mezclan bambuco con ritmos urbanos y enseñan tiple. Esa generalización no está justificada; las otras opciones son hechos que el texto respalda."},

{t:"El viento en territorio wayuu",tipo:"Reportaje",
 f:`<p>Una empresa de energía planea instalar un parque eólico en La Guajira, dentro del territorio de varias comunidades wayuu. El proyecto venderá energía limpia a la red nacional y promete empleos temporales durante la construcción y pagos anuales a las comunidades.</p><p>Por mandato de la Constitución y del Convenio 169 de la OIT, antes de construir debe hacerse una <b>consulta previa</b>, coordinada por el Ministerio del Interior. En la consulta deben participar las autoridades tradicionales de cada comunidad, que deciden según sus propias formas de organización.</p><p>Algunas familias apoyan el proyecto porque necesitan ingresos durante la sequía. Otras temen que los aerogeneradores afecten cementerios, sitios sagrados y las rutas de pastoreo de chivos, y piden que se escuche a los mayores antes de firmar cualquier acuerdo.</p><blockquote>«Respetamos plenamente la consulta previa. Por eso, si algunas familias no están de acuerdo, igual iniciaremos las obras con las que sí firmen, para no retrasar la transición energética del país», declaró una vocera de la empresa.</blockquote>`,
 esc:"Local",dim:["Política","Económica","Cultural","Ambiental"],ao:["Comunidades wayuu","Empresa de energía","Ministerio del Interior","Banco de la República","Clubes deportivos"],ac:["Comunidades wayuu","Empresa de energía","Ministerio del Interior"],
 ex:"El caso ocurre en un territorio concreto: escala local. Aquí se cruzan las cuatro dimensiones: la consulta es un derecho (política), hay energía, empleos y pagos (económica), sitios sagrados (cultural) y territorio de pastoreo (ambiental). Pensar así es pensamiento sistémico.",
 q:"¿Por qué puede decirse que la declaración de la vocera de la empresa es contradictoria?",
 o:["Porque la transición energética del país no tiene ninguna relación con los territorios indígenas.","Porque las empresas de energía no tienen permitido firmar acuerdos con comunidades indígenas.","Porque la consulta previa le da a cada familia un poder de veto absoluto sobre cualquier proyecto del país.","Porque dice respetar la consulta previa, pero anuncia que avanzará con acuerdos parciales, sin respetar la decisión colectiva de las comunidades a través de sus autoridades."],a:3,
 why:"La consulta es un proceso colectivo, con las autoridades tradicionales de cada comunidad. Decir que se respeta y, a la vez, anunciar obras con quienes firmen por separado es contradictorio."},

{t:"Un mundo partido en dos",tipo:"Texto expositivo",
 f:`<p>Al terminar la Segunda Guerra Mundial, en 1945, Estados Unidos y la Unión Soviética quedaron como las dos grandes potencias. Cada una defendía un modelo distinto: el capitalismo y la democracia liberal, por un lado; el socialismo con economía planificada, por el otro. Europa quedó dividida y cada bloque formó su propia alianza militar: la OTAN y el Pacto de Varsovia.</p><p>Durante más de cuatro décadas, ambas potencias compitieron por aliados, armas nucleares y prestigio, incluida la carrera espacial. Como las dos tenían arsenales nucleares capaces de destruir al adversario, una guerra directa podía significar la destrucción de ambas y de sus aliados en Europa. En 1962, durante la crisis de los misiles en Cuba, los dos gobiernos negociaron en secreto para evitar un ataque nuclear.</p><p>Aunque nunca se enfrentaron directamente, sí apoyaron bandos opuestos en guerras de Corea, Vietnam y Centroamérica. Varios países de Asia, África y América Latina, reunidos en el Movimiento de Países No Alineados, intentaron mantenerse al margen de los dos bloques.</p>`,
 esc:"Global",dim:["Política","Económica"],ao:["Estados Unidos","Unión Soviética","Países No Alineados","Comunidades wayuu","Juntas de acción comunal"],ac:["Estados Unidos","Unión Soviética","Países No Alineados"],
 ex:"El texto describe un orden mundial: escala global. Las dimensiones son política (bloques, alianzas, poder) y económica (capitalismo frente a economía planificada).",
 q:"De acuerdo con el texto, ¿cuál de los siguientes enunciados NO explica por qué Estados Unidos y la Unión Soviética evitaron un enfrentamiento militar directo?",
 o:["Ambas potencias tenían armas nucleares capaces de destruir al adversario.","Una guerra directa habría puesto en riesgo a sus aliados en Europa.","Las dos potencias compartían el mismo modelo económico y político.","En momentos de crisis, como en 1962, los dos gobiernos negociaron para evitar un ataque nuclear."],a:2,
 why:"El texto dice lo contrario: tenían modelos opuestos (capitalismo y socialismo). Las otras tres opciones sí aparecen en el texto como razones para evitar una guerra directa."}
];

/* ---------- Banco de respaldo: preguntas originales tipo Saber 11 (Sociales y Ciudadanas) ---------- */
const COMP={PS:"Pensamiento social",IP:"Interpretación y análisis de perspectivas",RS:"Pensamiento reflexivo y sistémico"};
const BANK=[
{tema:"Peaje en una vía rural",comp:"RS",tipo:"Choque de intereses",dif:"media",
 ctx:["La gobernación de un departamento firmó un contrato con una concesión privada para pavimentar 40 kilómetros de una vía terciaria que comunica tres veredas cafeteras con la cabecera municipal. A cambio, la empresa podrá cobrar un peaje durante quince años para recuperar su inversión y obtener ganancias.",
  "Los caficultores celebran que el café ya no se dañará en los camiones durante el invierno, pero advierten que el peaje, sumado a varios viajes por semana, puede costarles más de lo que ahorran. Los transportadores informales, que hoy cobran tarifas bajas, temen que el peaje los saque del negocio. La concesión, por su parte, sostiene que sin peaje ningún banco financiaría la obra y que la tarifa ya es la más baja permitida."],
 q:"En la situación descrita, el choque de intereses más directo se presenta entre",
 o:["la concesión, que necesita recuperar la inversión con el peaje, y los productores y transportadores, que deben pagarlo varias veces por semana.","la gobernación, que firmó el contrato, y los bancos, que se niegan a financiar obras en zonas rurales.","los caficultores, que quieren la vía pavimentada, y los transportadores informales, que prefieren la vía destapada.","la cabecera municipal, que recibe el café, y las veredas, que lo producen y lo transportan."],
 a:0,why:"El conflicto gira alrededor del peaje: la concesión depende de cobrarlo para recuperar su inversión, mientras caficultores y transportadores son quienes lo pagan con frecuencia. Ahí se oponen directamente los intereses.",
 wo:["","El texto no dice que los bancos se nieguen a financiar ni que estén en conflicto con la gobernación; la concesión solo menciona que sin peaje no habría crédito.","Los dos grupos comparten la preocupación por el costo del peaje; el texto no dice que los transportadores prefieran la vía destapada.","El texto no presenta ninguna disputa entre la cabecera y las veredas."]},

{tema:"Presupuesto participativo",comp:"PS",tipo:"Constitución y participación",dif:"media",
 ctx:["En un municipio del Huila, la alcaldía abrió un proceso de presupuesto participativo: cada comuna puede decidir, mediante votación de sus habitantes, en qué invertir una parte del presupuesto de inversión del año siguiente. En la comuna 3 ganó la propuesta de construir un polideportivo; en la comuna 5, la de arreglar el puesto de salud.",
  "Un concejal de la oposición afirma que el proceso es inconstitucional porque, según él, «la plata pública solo la puede decidir el Concejo» y los ciudadanos «no tienen por qué meterse en eso». La alcaldía responde que el Concejo sigue aprobando el presupuesto total y que el proceso solo amplía la participación en la priorización de una parte de la inversión."],
 q:"De acuerdo con la Constitución Política de 1991, ¿cuál de las siguientes afirmaciones evalúa mejor la postura del concejal?",
 o:["Es correcta, porque la democracia colombiana es exclusivamente representativa y los ciudadanos solo participan eligiendo a sus representantes.","Es incorrecta, porque la Constitución promueve la democracia participativa y permite que los ciudadanos incidan en las decisiones que los afectan, sin eliminar las funciones del Concejo.","Es correcta, porque el presupuesto participativo reemplaza al Concejo en la aprobación del presupuesto municipal.","Es incorrecta, porque la Constitución obliga a todos los municipios a decidir el presupuesto completo mediante votación popular."],
 a:1,why:"La Constitución de 1991 define a Colombia como una democracia participativa: además de elegir, los ciudadanos pueden incidir en las decisiones públicas. El proceso no le quita al Concejo su función de aprobar el presupuesto.",
 wo:["Es falsa: desde 1991 la democracia colombiana es participativa, no solo representativa.","","El texto dice lo contrario: el Concejo sigue aprobando el presupuesto total.","Exagera: la Constitución promueve la participación, pero no obliga a votar todo el presupuesto."]},

{tema:"Discurso sobre el transporte público",comp:"IP",tipo:"Idea central",dif:"alta",
 ctx:["Durante un foro sobre movilidad en una ciudad intermedia, el gerente de la empresa pública de buses pronunció este discurso ante concejales y líderes comunales:"],
 cita:{autor:"Gerente de la empresa de transporte",texto:"Sabemos que los usuarios están cansados de esperar el bus bajo la lluvia, y tienen razón. Pero también sabemos que cada vez que la tarifa se congela por presiones políticas, la empresa pierde dinero, deja de comprar repuestos y la flota envejece. No podemos seguir prometiendo buses nuevos con tarifas de hace cinco años. Una ciudad que quiere transporte digno tiene que aceptar que ese transporte cuesta, y que alguien, el usuario o el presupuesto municipal, debe pagarlo. Yo prefiero que lo pague el presupuesto, pero si el Concejo no aprueba ese subsidio, la tarifa tendrá que subir."},
 q:"¿Cuál es la idea que el gerente defiende con mayor énfasis en su discurso?",
 o:["Los usuarios tienen la culpa de la mala calidad del servicio porque se quejan demasiado.","El Concejo debe aumentar la tarifa del bus de inmediato para comprar buses nuevos.","Mejorar el transporte público requiere financiación suficiente, ya sea con un subsidio municipal o con un aumento de la tarifa.","La empresa de buses debería privatizarse para dejar de depender de decisiones políticas."],
 a:2,why:"Todo el discurso insiste en que el servicio cuesta y alguien debe pagarlo: prefiere un subsidio del presupuesto y, si no llega, una tarifa más alta. Esa es la idea central.",
 wo:["El gerente dice que los usuarios «tienen razón»; no los culpa.","El gerente prefiere que pague el presupuesto; subir la tarifa es su segunda opción, no lo que pide de inmediato.","","El discurso no menciona la privatización en ningún momento."]},

{tema:"Columna sobre migración",comp:"IP",tipo:"Prejuicio",dif:"alta",
 ctx:["En los últimos años, Colombia ha recibido a cerca de tres millones de personas migrantes provenientes de Venezuela. En un periódico regional se publicó una columna de opinión sobre el aumento de los hurtos en el centro de una ciudad fronteriza. Uno de sus apartes dice:",
  "Los datos de la Policía muestran que los hurtos en el centro subieron un 18 % en el último año. Ese mismo año llegaron miles de migrantes a la ciudad. La conclusión es evidente: si queremos recuperar la seguridad, la alcaldía debe restringir la permanencia de los venezolanos en el centro."],
 q:"El fragmento anterior contiene un prejuicio que no está justificado. ¿Cuál es?",
 o:["Que los hurtos en el centro aumentaron un 18 % en el último año.","Que el aumento de hurtos se explica por la llegada de personas migrantes, solo porque ambos hechos ocurrieron al mismo tiempo.","Que la alcaldía tiene la responsabilidad de garantizar la seguridad en el centro de la ciudad.","Que la ciudad recibió a miles de personas migrantes durante el último año."],
 a:1,why:"El columnista atribuye los hurtos a un grupo nacional sin ninguna prueba: solo porque los dos hechos coinciden en el tiempo. Generalizar sobre un grupo sin evidencia es un prejuicio.",
 wo:["Es un dato que la columna atribuye a la Policía, no un prejuicio.","","Es una función reconocida de las autoridades locales; no es un juicio sobre un grupo de personas.","Es un hecho que el texto presenta como contexto; no es un prejuicio."]},

{tema:"Titular sobre las pensiones",comp:"IP",tipo:"Contradicción",dif:"alta",
 ctx:["Un noticiero abrió su emisión con el siguiente titular: «La nueva reforma pensional asegura que todos los adultos mayores tendrán una pensión digna, siempre y cuando hayan cotizado al menos 1.000 semanas durante su vida laboral».",
  "Según cifras oficiales, más de la mitad de los trabajadores del país trabaja en la informalidad y nunca llega a cotizar esa cantidad de semanas. Un analista invitado afirmó que el titular, tal como está redactado, presenta la reforma de manera contradictoria."],
 q:"¿Por qué puede decirse que el titular es contradictorio?",
 o:["Porque mezcla temas económicos con temas sociales, que deberían tratarse por separado.","Porque una pensión digna depende de la voluntad política del gobierno y no de una reforma.","Porque las 1.000 semanas son demasiadas para cualquier trabajador del país.","Porque promete una pensión para «todos» los adultos mayores, pero la condiciona a un requisito que muchos no pueden cumplir."],
 a:3,why:"La contradicción está dentro del mismo titular: dice «todos» y enseguida pone una condición que, según los datos, más de la mitad de los trabajadores no cumple.",
 wo:["Mezclar lo económico y lo social no es una contradicción; muchas políticas tienen las dos dimensiones.","Es una opinión que no explica por qué el titular se contradice a sí mismo.","El texto no dice que nadie pueda cumplirlas; dice que muchos informales no lo logran. «Cualquier trabajador» exagera.",""]},

{tema:"Deforestación y ganadería",comp:"RS",tipo:"Lectura de datos",dif:"alta",
 tabla:{cols:["Año","Hectáreas deforestadas (región amazónica)","Cabezas de ganado en la región"],filas:[["2016","70.000","1,9 millones"],["2018","138.000","2,4 millones"],["2020","109.000","2,8 millones"],["2022","69.000","3,0 millones"]]},
 ctx:["Un grupo de estudiantes revisó datos ilustrativos sobre la región amazónica colombiana, organizados en la tabla. También leyó un informe según el cual buena parte de los bosques talados se convierte primero en potreros, y que en 2021 y 2022 aumentaron los controles de las autoridades ambientales y los acuerdos de conservación con comunidades campesinas.",
  "Uno de los estudiantes concluye: «Como la deforestación bajó en 2022, la ganadería ya no tiene ninguna relación con la pérdida de bosque»."],
 q:"¿Cuál de las siguientes afirmaciones evalúa mejor la conclusión del estudiante?",
 o:["Es acertada, porque la tabla muestra que la deforestación de 2022 fue la más baja de todo el periodo.","No es acertada, porque la cantidad de ganado siguió creciendo y la caída de la deforestación puede deberse a otros factores, como los controles y los acuerdos mencionados.","Es acertada, porque si la ganadería causara deforestación, ambas cifras tendrían que subir y bajar exactamente al mismo tiempo.","No es acertada, porque la tabla demuestra que la ganadería es la única causa de la deforestación en la región."],
 a:1,why:"Que un año baje la deforestación no elimina la relación con la ganadería: el ganado siguió aumentando y el texto menciona otros factores (controles y acuerdos) que pueden explicar la caída.",
 wo:["Además, 2022 no es el valor más bajo de forma clara (2016 fue similar); y un solo dato no prueba que la relación desaparezca.","","Las relaciones sociales y ambientales rara vez son tan exactas; varios factores influyen a la vez.","La tabla no puede probar que sea la «única» causa; esa conclusión también exagera."]},

{tema:"Pico y placa ampliado",comp:"RS",tipo:"Consecuencia no esperada",dif:"media",
 ctx:["Para reducir los trancones, la alcaldía de una ciudad grande amplió el pico y placa: ahora cada carro particular no puede circular dos días a la semana, en lugar de uno. La medida busca que más personas usen el transporte público o la bicicleta.",
  "Seis meses después, un estudio encontró que el número de carros matriculados en la ciudad había aumentado un 12 %. Muchas familias compraron un segundo vehículo, usualmente más viejo y más contaminante, con un número de placa distinto para poder circular todos los días."],
 q:"¿Cuál de las siguientes es una consecuencia NO esperada de la medida?",
 o:["Que más personas usen el transporte público durante los días de restricción.","Que disminuya la cantidad de carros que circulan en las horas pico.","Que aumente el parque automotor y la contaminación por la compra de segundos vehículos.","Que la alcaldía reciba quejas de algunos conductores por la restricción."],
 a:2,why:"La medida buscaba menos carros en la calle; comprar un segundo carro, más viejo y contaminante, va en contra de su propósito. Eso es una consecuencia no esperada.",
 wo:["Es justamente lo que la medida buscaba: es una consecuencia esperada.","También es el objetivo de la medida, no un efecto inesperado.","","Las quejas son previsibles ante cualquier restricción; no van en contra del propósito de la medida."]},

{tema:"Mecanismo para un derecho colectivo",comp:"PS",tipo:"Constitución y participación",dif:"alta",
 ctx:["Una empresa de reciclaje instaló una planta junto a un humedal de Bogotá. Desde entonces, los vecinos de tres barrios denuncian malos olores, basuras que llegan al agua y la muerte de aves. Han enviado cartas a la alcaldía local y a la autoridad ambiental, sin respuesta.",
  "En una reunión, una vecina propone presentar una acción de tutela; otro vecino dice que no sirve porque el problema afecta a toda la comunidad y al ambiente, no a una sola persona; un tercero propone convocar un referendo nacional. La líder comunal consulta a una abogada para escoger el mecanismo más adecuado."],
 q:"Según la Constitución, ¿cuál es el mecanismo más adecuado para proteger el derecho afectado en este caso?",
 o:["La acción popular, porque protege derechos colectivos como el goce de un ambiente sano.","El referendo, porque permite que toda la ciudadanía decida sobre el humedal.","El derecho de petición, porque obliga a la empresa a cerrar la planta de inmediato.","La acción de cumplimiento, porque sirve para proteger a cada vecino de manera individual."],
 a:0,why:"El derecho a un ambiente sano es un derecho colectivo, y la Constitución (art. 88) creó la acción popular para protegerlo. La tutela está pensada para derechos fundamentales de personas concretas.",
 wo:["","Un referendo nacional no es el mecanismo para resolver un daño ambiental concreto en un barrio.","El derecho de petición obliga a responder solicitudes, pero no ordena cerrar una planta.","La acción de cumplimiento sirve para exigir que se cumpla una ley o acto administrativo, y no protege a cada vecino individualmente."]},

{tema:"Gobierno escolar",comp:"PS",tipo:"Constitución y participación",dif:"media",
 ctx:["En un colegio público de Pereira, el rector decidió cambiar el horario de descanso sin consultar a nadie. El personero estudiantil recogió firmas y pidió que el tema se discutiera en el consejo directivo, donde hay representantes de estudiantes, docentes, padres y egresados.",
  "El rector respondió que el personero «solo está para organizar eventos» y que las decisiones del colegio «son del rector». Varios estudiantes quieren saber si el personero tiene razón al pedir que el tema se discuta en el consejo directivo."],
 q:"¿Cuál de las siguientes afirmaciones describe mejor la situación?",
 o:["El rector tiene razón, porque en los colegios públicos todas las decisiones dependen solo de él.","El personero se equivoca, porque su función es exclusivamente organizar actividades culturales.","El personero actúa dentro de su función de promover los derechos y deberes de los estudiantes, y el gobierno escolar existe para que la comunidad participe en las decisiones.","Los estudiantes deberían convocar un paro, porque es la única manera legal de cambiar una decisión del rector."],
 a:2,why:"La ley crea el gobierno escolar para que la comunidad educativa participe en las decisiones, y el personero tiene la función de promover los derechos de los estudiantes. Pedir que el consejo directivo estudie el tema está dentro de sus funciones.",
 wo:["Es falsa: el gobierno escolar (consejo directivo, consejo académico) existe precisamente para que no todo dependa del rector.","Es falsa: el personero promueve los derechos y deberes estudiantiles, no solo eventos.","","Exagera: hay otros caminos legales, como el que siguió el personero."]},

{tema:"Hambre en La Guajira",comp:"RS",tipo:"Compatibilidad de soluciones",dif:"alta",
 ctx:["Ante las muertes de niños por desnutrición en comunidades wayuu de La Guajira, un comité regional propuso cuatro medidas: (1) construir pozos y sistemas de almacenamiento de agua en las rancherías; (2) entregar complementos nutricionales adaptados a las costumbres alimentarias wayuu; (3) formar a madres comunitarias wayuu como gestoras de salud en su propia lengua; (4) apoyar huertas familiares resistentes a la sequía.",
  "Un funcionario del nivel central opina que el comité «debería escoger una sola medida, porque intentar varias a la vez es mezclar temas que no tienen nada que ver»."],
 q:"Frente a la opinión del funcionario, se puede afirmar que las cuatro medidas son",
 o:["incompatibles, porque atienden aspectos distintos: agua, alimentación, salud y producción.","compatibles, porque atacan diferentes causas de un mismo problema y respetan la cultura de las comunidades.","incompatibles, porque una política para comunidades indígenas solo puede ser cultural.","compatibles, porque todas buscan exclusivamente aumentar la producción agrícola de la región."],
 a:1,why:"La desnutrición tiene varias causas (falta de agua, de alimentos, de atención en salud). Atacarlas a la vez no es contradictorio sino complementario, y las medidas incluyen la lengua y las costumbres wayuu.",
 wo:["Que atiendan aspectos distintos no las vuelve incompatibles; al contrario, se complementan.","","Es falsa: los problemas de las comunidades indígenas también tienen dimensiones económicas, ambientales y de salud.","Solo la medida 4 tiene que ver con producción; «exclusivamente» es falso."]},

{tema:"Estudio sobre bebidas azucaradas",comp:"IP",tipo:"Credibilidad de la fuente",dif:"alta",
 ctx:["El Congreso discute un impuesto a las bebidas azucaradas para reducir la obesidad infantil. Durante el debate, una asociación de productores de gaseosas presentó un estudio que concluye que el impuesto «no reducirá el consumo y solo afectará a las familias pobres».",
  "Una periodista revisó el documento y encontró que fue financiado por las mismas empresas productoras, que no fue revisado por expertos independientes y que no publica la base de datos con la que se hicieron los cálculos. Por eso, recomendó a los ciudadanos ser cautelosos con sus conclusiones."],
 q:"¿Cuál de las siguientes razones apoya mejor la recomendación de la periodista?",
 o:["Los estudios económicos nunca son confiables porque se basan en suposiciones.","Las familias pobres no consumen bebidas azucaradas, así que el estudio es falso.","El estudio proviene de una de las partes interesadas en el resultado del debate y no permite verificar sus datos.","Los impuestos siempre reducen el consumo de cualquier producto."],
 a:2,why:"Quien financia el estudio tiene interés directo en que el impuesto no se apruebe, y además nadie puede revisar sus datos. Esas dos razones justifican ser cautelosos.",
 wo:["Generaliza: hay estudios económicos rigurosos; el problema aquí es este estudio en particular.","El texto no dice eso; es una afirmación inventada.","","Es una generalización falsa y no responde por qué desconfiar de la fuente."]},

{tema:"Migración del campo a la ciudad",comp:"RS",tipo:"NO explica",dif:"media",
 ctx:["En un municipio cafetero de Caldas, la población rural se redujo casi a la mitad en veinte años. Los jóvenes se van a estudiar a Manizales o a Bogotá y pocos regresan. Los caficultores mayores cuentan que el precio del café varía mucho y que hay años en que la cosecha no alcanza para cubrir los costos.",
  "Además, en las veredas no hay colegios con educación media completa, el internet llega con dificultad y los jóvenes dicen que en la ciudad encuentran más opciones de trabajo y de estudio. Al mismo tiempo, en el municipio se abrió un hotel campestre que contrató a quince personas de la zona."],
 q:"De acuerdo con el contexto, ¿cuál de los siguientes enunciados NO explica la salida de los jóvenes del campo?",
 o:["La falta de educación media completa en las veredas.","La inestabilidad de los ingresos que deja el cultivo del café.","Las mayores oportunidades de estudio y trabajo en la ciudad.","La apertura de un hotel campestre que generó empleo en la zona."],
 a:3,why:"El hotel creó empleo local, así que, si acaso, ayuda a que algunas personas se queden. No explica por qué se van. Las otras tres opciones sí son razones de la migración.",
 wo:["Sí explica la salida: para terminar sus estudios, los jóvenes deben irse.","Sí explica la salida: el café no garantiza ingresos estables.","Sí explica la salida: la ciudad los atrae con más opciones.",""]},

{tema:"Repartidores de plataformas",comp:"IP",tipo:"Argumento a favor",dif:"alta",
 ctx:["Miles de repartidores trabajan con aplicaciones de domicilios en las ciudades del país. Las empresas los consideran «socios independientes»: no tienen horario fijo, eligen cuándo conectarse y no reciben salario sino un pago por cada entrega. Por eso, las empresas no pagan su seguridad social.",
  "Un grupo de repartidores protestó para exigir que se les reconozca una relación laboral. Argumentan que la aplicación decide qué pedidos reciben, les baja la calificación si rechazan entregas y puede desconectarlos sin explicación."],
 q:"¿Cuál de los siguientes argumentos apoya mejor la postura de los repartidores?",
 o:["Si la empresa controla la asignación del trabajo y puede sancionar o desconectar a los repartidores, la relación se parece más a la de un empleado que a la de un socio independiente.","Los repartidores eligen cuándo conectarse, así que tienen la libertad propia de un trabajador independiente.","Las aplicaciones de domicilios generan empleo para muchas personas que no encuentran trabajo formal.","Si las empresas pagaran la seguridad social, el precio de los domicilios subiría para los clientes."],
 a:0,why:"La postura de los repartidores es que existe una relación laboral. El argumento que la apoya muestra subordinación: la empresa controla, sanciona y desconecta, como haría un empleador.",
 wo:["","Apoya la postura de las empresas, no la de los repartidores.","Es un argumento a favor de las plataformas en general; no apoya el reconocimiento de una relación laboral.","Es un argumento en contra de la exigencia de los repartidores."]},

{tema:"Consulta popular minera",comp:"RS",tipo:"Choque de intereses",dif:"alta",
 ctx:["En un municipio del Tolima, los habitantes votaron en una consulta popular y más del 90 % rechazó la minería de oro en su territorio. El Ministerio de Minas había otorgado previamente un título minero a una empresa multinacional, que ya había invertido en estudios de exploración.",
  "El alcalde afirma que la voluntad del pueblo debe respetarse. El Ministerio sostiene que el subsuelo pertenece a la Nación y que un municipio no puede decidir solo sobre recursos de todo el país. La empresa anuncia que demandará al Estado si no puede explotar el título. Los campesinos temen por el agua de los ríos que usan para sus cultivos de arroz."],
 q:"En esta situación, la tensión institucional más importante se da entre",
 o:["los campesinos arroceros y la empresa multinacional, por el precio del arroz.","la autonomía del municipio para decidir sobre su territorio y la competencia de la Nación sobre el subsuelo.","el alcalde y los campesinos, que tienen posiciones opuestas sobre la minería.","el Ministerio de Minas y la empresa, que quieren cosas distintas sobre el título minero."],
 a:1,why:"El fondo del conflicto es quién decide: el municipio, que votó en contra, o la Nación, dueña del subsuelo, que ya otorgó el título. Esa tensión entre niveles del Estado es la central.",
 wo:["El texto no habla del precio del arroz; los campesinos temen por el agua.","","El alcalde y los campesinos están del mismo lado: ambos defienden la decisión de la consulta.","El Ministerio otorgó el título y defiende que se respete; no está en contra de la empresa."]},

{tema:"El Frente Nacional",comp:"PS",tipo:"Consecuencia",dif:"media",
 ctx:["Entre 1958 y 1974, los partidos Liberal y Conservador acordaron el Frente Nacional: se turnaban la presidencia cada cuatro años y se repartían por partes iguales los cargos públicos. El pacto buscaba terminar la violencia entre ambos partidos, que había causado cientos de miles de muertes.",
  "Durante ese periodo disminuyó la violencia entre liberales y conservadores. Sin embargo, otros grupos políticos, como sectores de izquierda y movimientos campesinos, no podían llegar al poder por la vía electoral, porque el sistema solo reconocía a los dos partidos tradicionales."],
 q:"De acuerdo con el texto, una consecuencia del Frente Nacional fue",
 o:["la desaparición total de la violencia política en Colombia.","la exclusión de las fuerzas políticas distintas a los dos partidos tradicionales.","la creación de muchos partidos políticos nuevos que compitieron por la presidencia.","el fortalecimiento de la participación electoral de los movimientos campesinos."],
 a:1,why:"El texto dice que solo se reconocían los dos partidos tradicionales y que otros grupos no podían llegar al poder por elecciones. Esa exclusión fue una consecuencia del pacto.",
 wo:["Exagera: el texto dice que disminuyó la violencia bipartidista, no toda la violencia política.","","Es lo contrario de lo que describe el texto.","Es lo contrario: los movimientos campesinos quedaron por fuera del sistema."]},

{tema:"Libertad de prensa",comp:"PS",tipo:"Constitución y participación",dif:"media",
 ctx:["Un periódico digital publicó una investigación sobre posibles irregularidades en la contratación de un ministerio. Al día siguiente, el ministro declaró que la publicación «hace daño al país» y anunció que pedirá al Gobierno expedir un decreto para cerrar temporalmente el medio mientras se investiga si la información es cierta.",
  "Varias organizaciones de periodistas rechazaron el anuncio. Recordaron que si la información fuera falsa, las personas afectadas podrían pedir una rectificación o acudir a los jueces."],
 q:"A la luz de la Constitución, el anuncio del ministro",
 o:["es válido, porque el Gobierno puede cerrar los medios que critiquen a sus funcionarios.","es válido, porque mientras se investiga la información, la prensa debe suspender sus publicaciones.","vulnera la libertad de prensa, porque la Constitución prohíbe la censura y prevé mecanismos como la rectificación.","vulnera el derecho a la salud, porque las noticias negativas afectan a los ciudadanos."],
 a:2,why:"El artículo 20 de la Constitución garantiza la libertad de prensa y dice que no habrá censura. Si la información es falsa, existe el derecho a la rectificación y los jueces; cerrar el medio sería censura.",
 wo:["Es falsa: la Constitución prohíbe la censura y protege la crítica a los funcionarios.","Suspender un medio mientras se investiga es una forma de censura previa.","","No tiene relación con el derecho a la salud; el derecho en juego es la libertad de prensa."]},

{tema:"Víctimas y reincorporación",comp:"IP",tipo:"Perspectivas",dif:"alta",
 ctx:["En un municipio del Cauca funciona un proyecto productivo de café donde trabajan excombatientes que firmaron el acuerdo de paz. La alcaldía propone ampliar el proyecto y vincular también a familias campesinas de la zona.",
  "Una asociación de víctimas se opone: dice que primero deben conocer la verdad sobre lo que pasó con sus familiares desaparecidos y que «no es justo que quienes nos hicieron daño reciban apoyo antes que nosotros». Los excombatientes responden que el trabajo les permite construir una vida legal y que han participado en espacios de reconocimiento de responsabilidad. Los campesinos dicen que les interesa el proyecto, pero quieren garantías de seguridad."],
 q:"¿Cuál de las siguientes afirmaciones describe mejor la perspectiva de la asociación de víctimas?",
 o:["Rechazan cualquier proyecto productivo en el municipio, porque no les interesa el desarrollo económico.","Consideran que la verdad y la reparación de las víctimas deben tener prioridad frente al apoyo a los excombatientes.","Piensan que los campesinos no deberían participar en proyectos con excombatientes por razones de seguridad.","Creen que los excombatientes no han participado en ningún espacio de reconocimiento de responsabilidad."],
 a:1,why:"Las víctimas no rechazan el desarrollo: reclaman que primero se atiendan la verdad y la reparación, y les parece injusto que los excombatientes reciban apoyo antes. Esa es su perspectiva.",
 wo:["Exagera: el texto no dice que rechacen todo proyecto ni el desarrollo económico.","","La preocupación por la seguridad es de los campesinos, no de la asociación de víctimas.","Lo que el texto dice sobre los espacios de reconocimiento lo afirman los excombatientes; las víctimas no hablan de eso."]},

{tema:"Turismo en un río de colores",comp:"RS",tipo:"Dimensiones",dif:"media",
 ctx:["Un río famoso por sus colores, ubicado en un parque natural de la región de la Orinoquía, recibe cada año más turistas. Los hoteles y guías locales, muchos de ellos antiguos campesinos, viven ahora del turismo. Sin embargo, Parques Nacionales advierte que el exceso de visitantes y el uso de bloqueadores solares afectan las plantas acuáticas que dan el color al río.",
  "Por eso, se propuso limitar el número de visitantes por día. Los operadores turísticos temen perder ingresos; algunos líderes del pueblo indígena de la zona piden que se respeten los sitios sagrados del río que hoy los turistas usan para bañarse."],
 q:"¿Cuáles de las siguientes dimensiones están presentes en este caso?",
 o:["Ambiental, económica y cultural.","Solo ambiental y política.","Económica y militar.","Solo cultural y religiosa."],
 a:0,why:"Están en juego las plantas del río (ambiental), los ingresos del turismo (económica) y los sitios sagrados indígenas (cultural).",
 wo:["","Deja por fuera la dimensión económica (ingresos de hoteles y guías) y la cultural (sitios sagrados).","No hay ninguna dimensión militar en el caso.","Deja por fuera las dimensiones ambiental y económica, que son centrales."]},

{tema:"Desinformación electoral",comp:"RS",tipo:"Consecuencia",dif:"media",
 ctx:["Una semana antes de las elecciones a la alcaldía de una ciudad, circuló por grupos de mensajería un audio falso en el que, supuestamente, uno de los candidatos prometía cerrar todos los comedores comunitarios. El audio fue compartido miles de veces antes de que varios medios verificaran que era un montaje.",
  "La campaña afectada denunció el hecho ante la autoridad electoral. Algunos expertos señalan que, aunque el audio sea desmentido, muchas personas que lo recibieron nunca ven la verificación."],
 q:"¿Cuál de las siguientes es una consecuencia probable de la situación descrita?",
 o:["Que todos los votantes cambien su voto a favor del candidato afectado.","Que algunos ciudadanos decidan su voto con base en información falsa, lo que afecta la calidad de la decisión democrática.","Que los comedores comunitarios de la ciudad se cierren de inmediato.","Que la autoridad electoral cancele las elecciones en toda la ciudad."],
 a:1,why:"Si muchas personas recibieron el audio y nunca vieron la verificación, es probable que algunas voten creyendo algo falso. Eso afecta la calidad de la decisión democrática.",
 wo:["Exagera: no hay razón para pensar que todos los votantes cambien su voto.","","El audio era falso; nada indica que los comedores se vayan a cerrar.","Es una medida extrema que el texto no sugiere."]},

{tema:"Lengua indígena en el colegio",comp:"PS",tipo:"Constitución y participación",dif:"alta",
 ctx:["En un colegio del Vaupés, la mayoría de los estudiantes pertenece a pueblos indígenas y habla su lengua materna en casa. Un grupo de docentes propone que los primeros años se enseñen en la lengua de la comunidad y en español, e incluir en el currículo los conocimientos tradicionales sobre la selva.",
  "Un funcionario de la secretaría de educación se opone: afirma que «en Colombia la educación debe ser igual para todos» y que enseñar en otras lenguas «retrasa a los niños para el ICFES». Los padres de familia, reunidos en asamblea, apoyan la propuesta de los docentes."],
 q:"De acuerdo con la Constitución de 1991, la propuesta de los docentes",
 o:["es contraria a la Constitución, porque el español es el único idioma oficial en todo el territorio.","se ajusta a la Constitución, porque esta reconoce la diversidad étnica y cultural y establece que la enseñanza en comunidades con tradiciones lingüísticas propias será bilingüe.","es contraria a la Constitución, porque los conocimientos tradicionales no pueden hacer parte del currículo.","se ajusta a la Constitución solo si el ICFES aprueba primero la propuesta."],
 a:1,why:"La Constitución reconoce y protege la diversidad étnica y cultural (art. 7) y establece que las lenguas de los grupos étnicos son oficiales en sus territorios y que la enseñanza en esas comunidades será bilingüe (art. 10).",
 wo:["Es falsa: el artículo 10 dice que las lenguas de los grupos étnicos también son oficiales en sus territorios.","","Es falsa: la etnoeducación permite incluir los saberes propios de las comunidades.","El ICFES evalúa la educación; no aprueba los currículos ni es requisito constitucional para esta propuesta."]},

{tema:"Impuesto a las bebidas azucaradas",comp:"RS",tipo:"Beneficiarios y efectos",dif:"media",
 ctx:["Un país aprobó un impuesto que sube el precio de las bebidas azucaradas en un 20 %. Lo recaudado se destina a programas de alimentación escolar y a la compra de bebederos de agua potable en colegios públicos.",
  "Un año después, el consumo de estas bebidas bajó un 10 %. Los tenderos de barrio dicen que venden menos gaseosa pero más agua y jugos naturales. Las grandes productoras de bebidas reportaron menores ventas en el país."],
 q:"De acuerdo con la información, ¿a quiénes beneficia principalmente esta medida?",
 o:["A las grandes productoras de bebidas y a los tenderos.","A los estudiantes de colegios públicos y a la población que reduce su consumo de azúcar.","A los tenderos de barrio y a las grandes productoras de bebidas.","Solo al Estado, que recibe más dinero por impuestos."],
 a:1,why:"El dinero se invierte en alimentación escolar y agua potable para colegios públicos, y la menor ingesta de azúcar beneficia la salud de quienes reducen su consumo.",
 wo:["Las productoras venden menos, así que no son beneficiarias principales.","","Las productoras pierden ventas; además, para los tenderos el efecto es mixto.","El dinero no se queda en el Estado: se destina a programas para estudiantes."]},

{tema:"Estigmatización de jóvenes",comp:"IP",tipo:"Consecuencia",dif:"alta",
 ctx:["Tras varias riñas en un parque de un barrio popular, el alcalde local dio una entrevista: «Vamos a recuperar este parque. Ya sabemos quiénes son los que lo dañan: esos muchachos de gorra y tatuajes que se la pasan ahí sin hacer nada. Les pido a los vecinos que nos avisen cada vez que los vean».",
  "Un grupo de jóvenes del barrio, que organiza torneos de fútbol y clases de baile en el mismo parque, publicó un comunicado diciendo que la mayoría de quienes usan el parque no tiene nada que ver con las riñas."],
 q:"¿Cuál de las siguientes es una probable consecuencia de las palabras del alcalde?",
 o:["Que disminuyan las riñas porque los responsables quedan identificados con precisión.","Que los jóvenes con ciertas características físicas sean señalados y discriminados, aunque no tengan relación con las riñas.","Que aumente la oferta de actividades deportivas en el parque.","Que los vecinos dejen de usar el parque porque ya no hay problemas de seguridad."],
 a:1,why:"El alcalde no identifica responsables concretos: señala a un grupo por su apariencia (gorra, tatuajes). Esto puede llevar a estigmatizar a jóvenes que no tienen nada que ver con las riñas.",
 wo:["El alcalde no identifica a los responsables con precisión; describe a un grupo por su apariencia.","","Nada en las palabras del alcalde promueve actividades deportivas.","No tiene sentido: dejar de usar el parque no se sigue de que haya seguridad."]},

{tema:"Revolución Industrial",comp:"PS",tipo:"Consecuencia",dif:"media",
 ctx:["A finales del siglo XVIII y durante el XIX, en Inglaterra se extendió el uso de máquinas de vapor en fábricas textiles. Miles de familias campesinas migraron a las ciudades para trabajar en ellas. Las jornadas podían superar las 14 horas, trabajaban niños desde los siete años y no existían leyes que protegieran a los obreros.",
  "Con el tiempo, los trabajadores comenzaron a organizarse en asociaciones para exigir mejores condiciones, a pesar de que al principio estas organizaciones estaban prohibidas."],
 q:"De acuerdo con el texto, una consecuencia de las condiciones laborales en las fábricas fue",
 o:["la desaparición inmediata del trabajo infantil en toda Europa.","el surgimiento de organizaciones obreras que reclamaban derechos laborales.","el regreso masivo de las familias obreras al campo.","la eliminación de las máquinas de vapor en las fábricas."],
 a:1,why:"El texto dice que, ante las duras condiciones, los trabajadores empezaron a organizarse para exigir mejoras. Esas organizaciones son el origen del movimiento obrero y los sindicatos.",
 wo:["El texto no dice que el trabajo infantil desapareciera, y mucho menos de inmediato.","","El texto describe lo contrario: la migración del campo a la ciudad.","Nada en el texto indica que se eliminaran las máquinas."]},

{tema:"Tratado de libre comercio y leche",comp:"RS",tipo:"Choque de intereses",dif:"alta",
 ctx:["Por un tratado de libre comercio, cada año entra a Colombia más leche en polvo importada sin aranceles. Las grandes empresas procesadoras la compran porque es más barata que la leche de los productores nacionales, lo que les permite vender yogures y quesos a menor precio.",
  "Los pequeños ganaderos de Boyacá y Nariño, que venden leche fresca a esas mismas empresas, denuncian que el precio que les pagan bajó y que muchos están vendiendo sus vacas. Los consumidores urbanos, en cambio, notan que algunos lácteos bajaron de precio en los supermercados."],
 q:"En la situación descrita, ¿entre quiénes se presenta el choque de intereses más directo?",
 o:["Entre los consumidores urbanos y los supermercados, por el precio de los lácteos.","Entre los pequeños ganaderos nacionales y las procesadoras que prefieren comprar leche importada más barata.","Entre los ganaderos de Boyacá y los de Nariño, que compiten por vender leche.","Entre el Estado colombiano y los consumidores, por el cobro de aranceles."],
 a:1,why:"Las procesadoras ganan comprando leche importada barata, y eso hace bajar lo que les pagan a los pequeños ganaderos nacionales, que son sus proveedores. Ahí chocan directamente sus intereses.",
 wo:["Los consumidores se benefician de precios más bajos; el texto no muestra conflicto con los supermercados.","","Los dos grupos tienen el mismo problema; el texto no los presenta como rivales.","El tratado eliminó los aranceles; no hay un cobro que enfrente al Estado y los consumidores."]}
];

{post:"El profesor les pidió revisar también un mapa en el que se observa que los nuevos potreros aparecen, sobre todo, en zonas donde antes había bosque y cerca de carreteras abiertas recientemente. Una de las estudiantes recordó que en 2018 hubo un aumento fuerte de la deforestación en varias zonas del país, y que las cifras de un solo año no muestran por sí solas una tendencia."},

{post:"La empresa sostiene que cuenta con licencia ambiental y que genera 120 empleos para recicladores de la zona, muchos de ellos antes informales. Una organización ambiental presentó fotos y análisis de laboratorio que muestran altos niveles de contaminación en el agua del humedal desde que la planta empezó a funcionar."},
{post:"Algunos docentes apoyan al rector porque consideran que el nuevo horario mejora la organización del colegio, mientras que varios padres señalan que el cambio obliga a los estudiantes de la tarde a almorzar más tarde. La representante de los estudiantes ante el consejo directivo dice que nadie le informó del cambio antes de que se anunciara en la formación del lunes."},
{post:"El comité recordó que en varias rancherías el agua más cercana está a más de dos horas a pie, que muchas familias viven de la venta de artesanías y del pastoreo de chivos, y que las autoridades tradicionales wayuu pidieron participar en el diseño de cada medida. Un informe de la Defensoría del Pueblo señala que varios programas anteriores fracasaron, en parte, porque se diseñaron sin consultar a las comunidades."},
{pre:"Según el Ministerio de Salud, uno de cada cuatro niños en edad escolar tiene sobrepeso, y las bebidas azucaradas son la principal fuente de azúcar añadido en la dieta de los colombianos. Varios países de la región ya aplican impuestos similares y sus resultados se discuten en revistas científicas.",post:"Por su parte, un grupo de investigadores de universidades públicas publicó un análisis, revisado por otros expertos, que estima que el impuesto reduciría el consumo entre un 10 % y un 15 %."},
{post:"La alcaldía lanzó un programa de becas para que los jóvenes estudien carreras técnicas agropecuarias en el municipio, pero solo se inscribieron doce personas en el primer año. Algunos padres cuentan que prefieren que sus hijos no sigan en el café, porque ellos mismos han vivido muchos años de deudas."},

function genPrompt(s){return `Eres un experto en evaluación educativa que diseña preguntas para la prueba de Sociales y Ciudadanas del Saber 11 (ICFES, Colombia). Escribe UNA pregunta ORIGINAL de selección múltiple con única respuesta.
